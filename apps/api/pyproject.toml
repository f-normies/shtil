[project]
name = "clin-compass-api"
version = "0.1.0"
description = "Клинический компас: бэкенд (FastAPI, модульный монолит + worker)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "anyio>=4.15.1",
    "argon2-cffi>=25.1.0",
    "av==19.0.1",
    "asyncpg>=0.32.0",
    "boto3==1.43.115",
    "clin-compass-knowledge",
    "email-validator>=2.3.0",
    "fastapi>=0.143.2",
    "httpx2>=2.13.1",
    "openai>=3.31",
    "pgqueuer>=1.6.0",
    "pgvector>=0.5.0",
    "pillow>=13.0.0",
    "prometheus-client==0.26.0",
    "pydantic-ai-slim[openai]>=2.55",
    "pydantic-settings>=2.16.0",
    "pypdfium2>=5.13.0",
    "python-multipart==0.0.32",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
clin-compass-knowledge = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "clin_compass"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "N", "BLE", "T20", "PTH"]
# Кириллица в строках и комментариях — норма для проекта, а не «похожие символы».
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# __table_args__ = {"schema": ...} — штатная запись SQLAlchemy.
"**/models.py" = ["RUF012"]
# Автогенерация Alembic: длинные строки и заголовок с пробелом в конце.
"migrations/versions/*.py" = ["E501", "W291"]
# Тесты опрашивают внешнее состояние (сервер, pg_stat_activity) циклом с паузой.
"tests/**" = ["ASYNC110"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["clin_compass"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "boto3.*", "botocore.*", "pgqueuer.*", "testcontainers.*"]
ignore_missing_imports = true

# В пакете knowledge/ пока нет маркера py.typed; аннотации в нём есть, проверяем по ним.
[[tool.mypy.overrides]]
module = ["clin_compass_knowledge", "clin_compass_knowledge.*"]
follow_untyped_imports = true

# У pypdfium2 нет маркера py.typed.
[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

# Границы модулей (спека фундамента, 3.2). Новый модуль добавляет свой protected-контракт:
# снаружи модуля доступны только service.py, schemas.py и deps.py.
[tool.importlinter]
root_package = "clin_compass"

[[tool.importlinter.contracts]]
name = "core не зависит от модулей"
type = "forbidden"
source_modules = ["clin_compass.core"]
forbidden_modules = ["clin_compass.modules"]

[[tool.importlinter.contracts]]
name = "identity: внутренности модуля закрыты"
type = "protected"
protected_modules = [
    "clin_compass.modules.identity.models",
    "clin_compass.modules.identity.security",
    "clin_compass.modules.identity.throttle",
    "clin_compass.modules.identity.api",
]
allowed_importers = ["clin_compass.modules.identity", "clin_compass.schema", "clin_compass.main"]

