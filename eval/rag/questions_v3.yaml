    critical: false
    evidence:
    - {key: kr-gad-2024/doc_diag_2_5/2, fingerprint: cbd8e8f234ef}
  - text: 'Эффективность лечения КР предлагают оценивать по шкале Гамильтона (HARS): ответ — снижение более чем на 50%, ремиссия — менее 7 баллов.'
    critical: false
