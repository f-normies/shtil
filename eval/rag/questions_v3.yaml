- id: s-166
  question: Если после отмены лечения ГТР симптомы вернулись через полгода, возвращаться к прежнему препарату или подбирать новый?
  type: reference
  asker: терапевт
  style: full
  kind: multi
  split: dev
  points:
  - text: 'ГТР часто рецидивирует: после отмены психофармакотерапии симптомы могут вернуться.'
    critical: false
    evidence:
    - {key: kr-gad-2024/doc_3/1, fingerprint: cde760ff2ece}
    - {key: kr-gad-2024/doc_3/30, fingerprint: d37f8be1f94d}
  - text: Эффективную терапию продолжают не менее 6 месяцев после наступления эффекта, чаще — 12 месяцев и дольше.
    critical: true
    evidence:
    - {key: kr-gad-2024/doc_3/30, fingerprint: d37f8be1f94d}
  - text: Для профилактики рецидива АД оставляют в той дозе, на которой был получен эффект, ещё на 6–12 месяцев.
    critical: true
    evidence:
    - {key: kr-gad-2024/doc_3/30, fingerprint: d37f8be1f94d}
  - text: Препарат выбирают индивидуально по эффективности и переносимости; при неэффективности переходят на другой препарат первой линии, не использованный ранее.
    critical: false
    evidence:
    - {key: kr-gad-2024/doc_3/5, fingerprint: f4ea712bf22d}
  - text: Пациента с ГТР ведёт психиатр или психотерапевт, который корректирует терапию и правильно её отменяет.
    critical: false
    evidence:
    - {key: kr-gad-2024/doc_5/3, fingerprint: 19c677a154a7}
  must_not: ['Утверждать, что КР прямо предписывают вернуть прежний препарат или обязательно сменить его', Предлагать короткий курс после рецидива без поддерживающего этапа]
  relevant:
