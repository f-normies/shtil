- id: s-158
  question: на авиандре память и внимание не страдают? пациент программист боится отупеть
  type: reference
  asker: невролог
  style: short
  kind: multi
  split: dev
  points:
  - text: В исследованиях на фоне маритупирдина не было выраженной седации, а когнитивные функции и психомоторные навыки не нарушались.
    critical: false
    evidence:
