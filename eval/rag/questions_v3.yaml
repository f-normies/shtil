- id: s-154
  question: Женщина собирается беременеть через несколько месяцев, сейчас принимает Авиандр. Нужна ли контрацепция на время курса и есть ли данные о влиянии на фертильность?
  type: reference
  asker: терапевт
  style: full
  kind: multi
  split: dev
  points:
  - text: Маритупирдин противопоказан при беременности и грудном вскармливании; данных о применении у беременных нет.
    critical: true
    evidence:
    - {key: aviandr-ohlp/4.6/1, fingerprint: 7cb693c1639b}
  - text: Если беременность наступила во время приёма или препарат принимали в первом триместре, женщину предупреждают о возможном вреде для плода.
    critical: true
    evidence:
