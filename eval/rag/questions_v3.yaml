    - {key: kr-depression-2024/doc_3/3, fingerprint: fc05e9dc0fcd}
  - text: ТЦА не назначают при ССЗ умеренной и выраженной тяжести, когнитивных нарушениях и судорожных состояниях.
    critical: true
