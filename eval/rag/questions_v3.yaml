    critical: false
    evidence:
    - {key: kr-depression-2024/doc_3/21, fingerprint: 5dd21744b89d}
  - text: Неэффективность двух адекватных курсов разных групп соответствует определению резистентности.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_terms/1, fingerprint: 36fbe360049d}
  - text: Предусмотрены комбинации АД с комплементарным механизмом действия.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_3/28, fingerprint: 0435b101f378}
  - text: Другой вариант — аугментация АВП.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_3/29, fingerprint: 7953bde9a5db}
    - {key: kr-depression-2024/doc_3/30, fingerprint: 8f97c938c2ab}
    - {key: kr-depression-2024/doc_3/31, fingerprint: 5788f4fbdbd2}
  - text: При комбинировании учитывать лекарственные взаимодействия и усиление побочных эффектов.
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_3/28, fingerprint: 0435b101f378}
  must_not: [Считать резистентность доказанной без проверки диагноза и фактического приёма.]
