- id: s-146
  question: О каких нежелательных реакциях на Авиандр предупредить пациента на старте? Какие из них встречаются чаще всего?
  type: reference
  asker: невролог
  style: full
  kind: multi
  split: dev
  points:
  - text: Чаще всего бывают головокружение, сонливость и астения — в первые дни; обычно они проходят без отмены препарата.
    critical: false
    evidence:
    - {key: aviandr-ohlp/4.8/1, fingerprint: 3d991b70c68b}
  - text: К частым реакциям также относятся головная боль и парестезии.
    critical: false
    evidence:
    - {key: aviandr-ohlp/4.8/2, fingerprint: 6b99dd561ebb}
  - text: Нечасто в начале возможны бессонница и усиление тревоги, а также тошнота и запор.
    critical: false
    evidence:
    - {key: aviandr-ohlp/4.8/2, fingerprint: 6b99dd561ebb}
  - text: При головокружении или сонливости нельзя водить машину и работать с механизмами.
    critical: true
    evidence:
    - {key: aviandr-ohlp/4.7/1, fingerprint: 3dcff5a9d624}
  - text: Пациента предупреждают, что алкоголь и средства с этанолом нужно исключить.
    critical: true
    evidence:
    - {key: aviandr-ohlp/4.5/1, fingerprint: 26491090dfd3}
  must_not: ['Приписывать Авиандру нежелательные реакции, которых нет в ОХЛП, например сексуальную дисфункцию или удлинение QT']
