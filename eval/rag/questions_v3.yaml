- id: s-224
  question: Когда после инсульта стоит начинать антидепрессант и какой выбрать с учётом клопидогрела?
  patient: Ж, 61 год. Ишемический инсульт 3 месяца назад, лёгкий правосторонний гемипарез. Клопидогрел 75 мг, аторвастатин 20 мг. Плаксивость, безразличие к реабилитации, PHQ-9 15.
