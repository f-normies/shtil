  - {key: kr-gad-2024/doc_b/3, fingerprint: b58d5d694b12, grade: 1}
  note: Взаимодействие с кларитромицином и амоксициллином в ОХЛП не описано; вывод «оставить без изменений» опирается на отсутствие указаний и на данные по омепразолу.
- id: s-263
  question: какой сиозс меньше всего качает мно на варфарине с механикой? феварин точно нет?
  patient: М, 71 год. Механический протез митрального клапана, варфарин, целевое МНО 2,5–3,5. Депрессия 3 месяца, PHQ-9 15.
  type: case
  asker: кардиолог
  style: short
  kind: multi
  split: dev
  points:
  - text: СИОЗС влияют на тромбоциты и повышают риск кровотечений, особенно с антиагрегантами, поэтому на антикоагулянте нужна осторожность.
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_3/3, fingerprint: fc05e9dc0fcd}
  - text: Эсциталопрам может менять действие пероральных антикоагулянтов, поэтому свертываемость тщательно контролируют при его начале и отмене.
    critical: true
    evidence:
    - {key: cipralex-ohlp/4.5/3, fingerprint: 51f1c153a4a3}
    - {key: cipralex-ohlp/4.4/3, fingerprint: 39f7ededcdf5}
  - text: Флувоксамин ингибирует CYP1A2 и CYP2C19, а у сертралина значимого ингибирования ферментов CYP в таблице КР не указано.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_a3/5, fingerprint: 093f2f500c6b}
    - {key: kr-depression-2024/doc_a3/6, fingerprint: 66c79f2d6a19}
  - text: При сердечно-сосудистой патологии СИОЗС — препараты первого выбора, а ТЦА при умеренной и выраженной кардиальной патологии не назначают.
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_3/3, fingerprint: fc05e9dc0fcd}
  - text: Пациентам старше 65 лет эсциталопрам дают в половинной дозе 5 мг/сут, максимум 10 мг/сут.
    critical: true
    evidence:
    - {key: cipralex-ohlp/4.2/2, fingerprint: 46898baeb3a9}
  must_not: ['Утверждать со ссылкой на корпус, что какой-либо СИОЗС не влияет на МНО', Выдумать величину изменения МНО, Начать эсциталопрам без контроля свертываемости при старте и отмене]
  relevant:
  - {key: cipralex-ohlp/4.2/2, fingerprint: 46898baeb3a9, grade: 2}
  - {key: cipralex-ohlp/4.4/3, fingerprint: 39f7ededcdf5, grade: 2}
