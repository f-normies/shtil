  note: 'Переразметка #105: добавлены пункты из ОХЛП Ципралекса: эсциталопрам меняет действие пероральных антикоагулянтов, нужен контроль свертываемости; доза старше 65 лет. Пункт КР о QTc убран ради лимита. Данных о МНО для других СИОЗС в корпусе нет. «Феварин» — флувоксамин.'
- id: s-264
  question: Похожи ли эти жалобы на нежелательные реакции Авиандра и стоит ли продолжать приём?
  patient: М, 39 лет. ГТР, Авиандр 20 мг 2 раза в день 5 дней. Появились головная боль и тошнота, тревога пока без изменений.
