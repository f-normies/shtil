    - {key: kr-depression-2024/doc_6/1, fingerprint: 29914359d363}
  - text: Тяжёлый ДЭ с психотическими симптомами лечат только в стационаре.
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_3/11, fingerprint: 462715e17df6}
  - text: Лёгкий и средний ДЭ при низком суицидальном риске лечат амбулаторно в психоневрологическом диспансере.
    critical: false
