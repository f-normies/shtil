- id: s-172
  question: авиандр как работает вообще, на какие рецепторы? пациенту объяснить что это не транквилизатор
  type: reference
  asker: невролог
  style: short
  kind: multi
  split: dev
  points:
  - text: 'Маритупирдин действует на несколько групп рецепторов: адренергические, дофаминовые, серотониновые и гистаминовые.'
    critical: false
    evidence:
    - {key: aviandr-ohlp/5.1/1, fingerprint: 8e1590d4d1c9}
  - text: Сильнее всего он связывается с 5-HT7, слабее — с 5-HT6, 5-HT2A и 5-HT2C; блокирует α2-адренорецепторы и H1, к дофаминовым рецепторам сродство очень низкое.
    critical: false
    evidence:
    - {key: aviandr-ohlp/5.1/1, fingerprint: 8e1590d4d1c9}
  - text: Он не блокирует обратный захват нейромедиаторов, не действует на ГАМК-рецепторы и не обладает антихолинергическим действием.
    critical: false
    evidence:
    - {key: aviandr-ohlp/5.1/1, fingerprint: 8e1590d4d1c9}
  - text: По классификации это анксиолитик (АТХ N05BX), но небензодиазепиновый, с мультимодальным механизмом.
    critical: false
    evidence:
    - {key: aviandr-ohlp/5.1/1, fingerprint: 8e1590d4d1c9}
  - text: В исследованиях зависимости и синдрома отмены не выявлено, но ОХЛП допускает их, как у любого психотропного препарата.
    critical: true
    evidence:
    - {key: aviandr-ohlp/4.4/1, fingerprint: be08af5cb9a7}
  must_not: ['Утверждать, что Авиандр действует через ГАМК- или бензодиазепиновые рецепторы либо блокирует обратный захват серотонина', 'Обещать пациенту, что зависимость невозможна']
  relevant:
  - {key: aviandr-ohlp/4.4/1, fingerprint: be08af5cb9a7, grade: 2}
  - {key: aviandr-ohlp/5.1/1, fingerprint: 8e1590d4d1c9, grade: 2}
  - {key: aviandr-ohlp/5.1/2, fingerprint: 69b5d0fd0c1b, grade: 2}
  - {key: aviandr-ohlp/5.3/1, fingerprint: 40bd2db4b2cb, grade: 2}
  note: По АТХ Авиандр — анксиолитик (N05BX). Пациенту точнее объяснить, что это небензодиазепиновое средство, а не «не транквилизатор».
- id: s-173
