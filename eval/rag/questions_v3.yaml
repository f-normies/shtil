  patient: Ж, 63 года. Депрессивные симптомы четыре месяца. Венлафаксин принимает шесть недель, последние две — 150 мг/сут; за это время АД выросло с обычных 130/80 до 165/95 мм рт. ст. АГ, принимает периндоприл и амлодипин.
