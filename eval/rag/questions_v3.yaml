- id: s-062
  question: Достаточно ли уменьшения балла для продолжения той же схемы или нужно активнее менять лечение?
  patient: Ж, 57 лет. Подавленность и отсутствие удовольствия полгода. Эсциталопрам 20 мг/сут принимает восемь недель регулярно, PHQ-9 снизился с 22 до 16; домашние дела по-прежнему даются тяжело. СД 2 типа, принимает метформин.
  type: case
  asker: терапевт
  style: full
  kind: multi
  split: test
  points:
  - text: Повторно оценить диагноз, дозу и приверженность.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_3/21, fingerprint: 5dd21744b89d}
  - text: Оценить клиническую симптоматику и восстановление функционирования, а не только снижение числа в анкете.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_diag_2/4, fingerprint: 33aade2c68e4}
  - text: Доза 20 мг/сут уже максимальная для эсциталопрама при депрессии; дальнейшее повышение не предусмотрено.
    critical: true
    evidence:
    - {key: cipralex-ohlp/4.2/1, fingerprint: f7fed8287f68}
  - text: При невозможности целесообразного повышения дозы предусмотрена смена АД.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_3/24, fingerprint: 5329ce737f56}
  - text: При сахарном диабете эсциталопрам может менять гликемический контроль; может понадобиться коррекция сахароснижающей терапии.
    critical: false
    evidence:
    - {key: cipralex-ohlp/4.4/1, fingerprint: a61924d3a689}
  must_not: [Признать ремиссию только из-за уменьшения PHQ-9 с 22 до 16., Повысить эсциталопрам выше 20 мг/сут — максимальной дозы по ОХЛП.]
