- id: s-063
  question: Какие следующие шаги предусмотрены, если две последовательные попытки лечения не дали существенного эффекта?
  patient: М, 47 лет. Депрессивные симптомы десять месяцев. Сертралин 150 мг/сут принимал восемь недель, затем венлафаксин 225 мг/сут десять недель; приём регулярный, HAM-D остаётся 24. Сейчас принимает венлафаксин, сопутствующих соматических заболеваний нет.
  type: case
  asker: психиатр
  style: full
  kind: multi
  split: test
  points:
