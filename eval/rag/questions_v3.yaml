- id: s-061
  question: Что делать с лечением, если пациент считает нарушение половой функции неприемлемым, хотя настроение улучшилось?
  patient: 'М, 44 года. Депрессивные симптомы пять месяцев. На сертралине 100 мг/сут десять недель: настроение лучше, но последние шесть недель снижено либидо и затруднён оргазм. АГ, принимает лозартан.'
  type: case
  asker: невролог
  style: full
  kind: multi
  split: dev
  points:
  - text: Снижение либидо и нарушение оргазма входят в профиль побочных явлений СИОЗС.
    critical: false
