- id: s-174
  question: Пациент с ГТР ходит с жалобами на сердце, желудок и мышцы. Какие телесные симптомы типичны для ГТР и как не отправлять его по кругу обследований?
  type: reference
  asker: невролог
  style: full
  kind: multi
  split: test
  points:
  - text: 'Типично мышечное напряжение: тремор, неспособность расслабиться, боли разной локализации, головная боль, скованность мышц спины и плеч.'
    critical: false
    evidence:
    - {key: kr-gad-2024/doc_crat_info_1_6/1, fingerprint: 475a81529409}
  - text: 'Типична вегетативная гиперактивность: потливость, тахикардия, сухость во рту, дискомфорт в эпигастрии, головокружение.'
    critical: false
    evidence:
    - {key: kr-gad-2024/doc_crat_info_1_6/1, fingerprint: 475a81529409}
  - text: Обследование нацелено на исключение соматических болезней; всем рекомендованы базовые анализы, гормоны щитовидной железы и ЭКГ.
    critical: true
    evidence:
    - {key: kr-gad-2024/doc_diag_2_3/1, fingerprint: d2e46b71e922}
    - {key: kr-gad-2024/doc_diag_2_3/5, fingerprint: 808ef4dc45ad}
    - {key: kr-gad-2024/doc_diag_2_4/5, fingerprint: 4b8652e93254}
  - text: ЭЭГ, дуплексное сканирование сосудов и МРТ мозга назначают, только если анамнез, осмотр и анализы не позволяют надёжно исключить патологию.
    critical: false
    evidence:
    - {key: kr-gad-2024/doc_diag_2_4/2, fingerprint: 0a70d3ea00c9}
  - text: Если найдено соматическое заболевание, ГТР рассматривают как коморбидное расстройство.
    critical: false
    evidence:
    - {key: kr-gad-2024/doc_diag_2_1/7, fingerprint: 9778845f5247}
  must_not: ['Ставить ГТР без базового исключения соматических причин (ЭКГ, анализы, щитовидная железа)', 'Утверждать, что КР требуют расширенных инструментальных обследований всем пациентам без показаний']
