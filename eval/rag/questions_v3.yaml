- id: s-171
  question: При каких состояниях пациента с депрессией нужно госпитализировать, а не продолжать вести амбулаторно?
  type: reference
  asker: терапевт
  style: full
  kind: multi
  split: test
  points:
  - text: Тяжёлый ДЭ, с психотическими симптомами или без, — показание к стационару.
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_6/1, fingerprint: 29914359d363}
  - text: Высокий суицидальный риск — показание к стационару при любой тяжести депрессии.
    critical: true
