- id: s-058
  question: Можно ли считать это обычной тревожной депрессией и назначить антидепрессант до консультации психиатра?
  patient: М, 32 года. Два месяца подавленности и упадка сил. В прошлом были недели, когда спал по три часа без усталости, много говорил и необдуманно тратил деньги. Соматических заболеваний нет, текущих препаратов нет.
  type: case
  asker: невролог
  style: full
  kind: multi
  split: dev
  points:
  - text: Собрать целевой анамнез маниакальных, гипоманиакальных и смешанных эпизодов для исключения БАР.
