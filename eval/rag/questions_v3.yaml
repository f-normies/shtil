  question: две нед на авиандре 2 р/д эффекта ноль — ждать еще или менять и на что
  patient: М, 50 лет. ГТР, Авиандр 20 мг 2 раза в день 2 недели, принимает регулярно. GAD-7 14 (до лечения 15).
