  question: Как оценить этот пункт анкеты, если в разговоре пациент отрицает намерение причинить себе вред?
  patient: М, 60 лет. Шесть недель плохого сна и снижения интереса к жизни. PHQ-9 — 11, на пункт о смерти ответил «несколько дней», но говорит, что ничего с собой делать не собирается. ХОБЛ, использует тиотропий; психотропных препаратов нет.
