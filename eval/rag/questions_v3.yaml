    - {key: kr-depression-2024/doc_3/22, fingerprint: 6c66f9d51b64}
    - {key: kr-depression-2024/doc_3/23, fingerprint: 961052c08a6b}
  - text: Диапазон доз сертралина — 50–200 мг/сут, запас для повышения есть.
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_a3/3, fingerprint: 16fb64458a24}
  - text: АД меняют, когда повышать дозу нецелесообразно, например при плохой переносимости.
