    - {key: kr-depression-2024/doc_3/13, fingerprint: 14cbc39d28d8}
  - text: 'Пациентке без текущей терапии назначают АВП: луразидон 20–60 мг/сут, или зипрасидон 40–160 мг/сут, или карипразин 1,5–3 мг/сут.'
