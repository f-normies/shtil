    - {key: kr-depression-2024/doc_3/3, fingerprint: fc05e9dc0fcd}
  - text: СИОЗС повышают риск кровотечений, особенно вместе с антиагрегантами.
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_3/3, fingerprint: fc05e9dc0fcd}
  - text: На венлафаксине контролируют артериальное давление из-за риска гипертензии.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_3/3, fingerprint: fc05e9dc0fcd}
  - text: Перед назначением терапии рекомендованы консультации терапевта и невролога для учёта противопоказаний и соматических рисков.
