    evidence:
    - {key: kr-depression-2024/doc_3/15, fingerprint: c9eec3f3b465}
    - {key: kr-depression-2024/doc_3/16, fingerprint: dbd6037af841}
    - {key: kr-depression-2024/doc_3/17, fingerprint: 0878d5c6f544}
  - text: Смешанные черты устанавливают при критериях ДЭ и трёх и более симптомах мании или гипомании; дополнительно расспрашивают о маниакальных эпизодах в прошлом.
    critical: false
    evidence:
