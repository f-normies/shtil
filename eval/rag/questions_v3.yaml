- id: s-260
  question: Правомерно ли при таких в основном телесных жалобах ставить депрессию и начинать антидепрессант, если подавленность она отрицает?
  patient: Ж, 31 год. Около года головокружения, боли в шее и спине, «ком в горле», утомляемость. Неврологический статус и обследование без патологии. Настроение называет нормальным, но перестала встречаться с друзьями, рано просыпается. PHQ-9 13.
  type: case
  asker: невролог
  style: full
  kind: multi
  split: test
  points:
  - text: Многие пациенты с депрессией не жалуются на ядерные симптомы сами, поэтому нужен прицельный расспрос.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_diag_2_1/2, fingerprint: bc6347af6292}
  - text: Для ДЭ нужны два из трёх типичных симптомов (сниженное настроение, утрата интересов, утомляемость) и дополнительные симптомы от двух недель — подавленность не обязательна.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_diag_2/4, fingerprint: 33aade2c68e4}
  - text: Раннее пробуждение на два часа и больше и утрата интересов относятся к соматическим симптомам депрессии.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_diag_2/1, fingerprint: fa6894b8e3dc}
  - text: Сочетание соматических депрессивных симптомов с болью или истощаемостью без органической причины относят к другим депрессивным эпизодам (F32.8).
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_diag_2/5, fingerprint: c0ebf464390d}
  - text: Диагноз ставит психиатр после психопатологического обследования с оценкой суицидального риска.
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_diag_2_1/1, fingerprint: db0a5cd907fb}
