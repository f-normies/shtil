- id: s-152
  question: В каких случаях при депрессии рассматривают электросудорожную терапию?
  type: reference
  asker: психиатр
  style: full
  kind: multi
  split: test
  points:
  - text: 'При резистентности, когда первый–третий этапы терапии не помогли, рекомендован курс ЭСТ: 8–12 сеансов за 2–4 недели, 3 раза в неделю через день, отдельно или вместе с АД.'
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_3/39, fingerprint: f14c2d0238d4}
  - text: ЭСТ применяют рано при психотической депрессии с бредом, выраженном возбуждении или заторможенности, высоком суицидальном риске, отказе от еды, противопоказаниях к лекарствам (например, беременность).
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_3/39, fingerprint: f14c2d0238d4}
  - text: При высоком суицидальном риске лечение проводят в стационаре и рассматривают быстрое проведение ЭСТ.
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_3/10, fingerprint: 841ca6bea3a8}
  - text: ЭСТ рассматривают раньше, если она помогала в прошлых эпизодах, и при ДЭ со смешанными чертами после неудачи первых трёх этапов.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_3/39, fingerprint: f14c2d0238d4}
    - {key: kr-depression-2024/doc_3/46, fingerprint: 91035081d6d5}
  - text: Абсолютное противопоказание к ЭСТ одно — повышенное внутричерепное давление; осторожность нужна при цереброваскулярной недостаточности, недавнем инфаркте, аритмии, аневризме, тяжёлом остеопорозе.
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_3/39, fingerprint: f14c2d0238d4}
