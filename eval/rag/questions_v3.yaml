- id: s-157
  question: У пациента ГТР и хроническая головная боль напряжения. Какой препарат может помочь сразу с обеими проблемами?
  type: reference
  asker: невролог
  style: full
  kind: multi
  split: test
  points:
  - text: Головная боль (обычно двусторонняя, в лобной и затылочной областях) — проявление мышечного напряжения, одного из типичных кластеров симптомов ГТР.
    critical: false
    evidence:
    - {key: kr-gad-2024/doc_crat_info_1_6/1, fingerprint: 475a81529409}
  - text: При преобладании соматических эквивалентов тревоги на втором этапе рекомендована монотерапия прегабалином 150–600 мг/сут в 2–3 приёма.
    critical: true
    evidence:
    - {key: kr-gad-2024/doc_3/8, fingerprint: 72b0b50b1d7a}
    - {key: lyrica-ohlp/4.2/1, fingerprint: df863c774367}
  - text: Прегабалин не назначают пациентам с зависимостью от ПАВ или склонностью к ней; нужен наркологический анамнез.
    critical: true
    evidence:
    - {key: kr-gad-2024/doc_3/8, fingerprint: 72b0b50b1d7a}
  - text: Первая линия при ГТР — СИОЗС, агомелатин, венлафаксин (75–225 мг/сут) или дулоксетин (30–120 мг/сут); выбор учитывает соматотропное действие препарата.
    critical: true
    evidence:
    - {key: kr-gad-2024/doc_3/3, fingerprint: 293140c7776d}
  - text: СИОЗС могут усиливать головные боли напряжения и мигрень, а у эсциталопрама головная боль — очень частая нежелательная реакция.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_3/3, fingerprint: fc05e9dc0fcd}
    - {key: cipralex-ohlp/4.8/3, fingerprint: 8f50a2bcad5e}
  must_not: ['Утверждать, что КР рекомендуют амитриптилин или другой препарат для лечения головной боли напряжения', Выдумать дозы для профилактики головной боли со ссылкой на КР, 'Утверждать, что прегабалин или эсциталопрам по ОХЛП показаны при головной боли напряжения']
  relevant:
  - {key: cipralex-ohlp/4.8/3, fingerprint: 8f50a2bcad5e, grade: 2}
