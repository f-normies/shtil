- id: s-161
  question: Пациенту с хронической сердечной недостаточностью и брадикардией можно назначать Авиандр?
  type: reference
  asker: кардиолог
  style: full
  kind: multi
  split: test
  points:
  - text: ССЗ не входят в противопоказания, но из-за недостатка клинических данных маритупирдин при ССЗ применяют с осторожностью.
    critical: true
    evidence:
    - {key: aviandr-ohlp/4.4/1, fingerprint: be08af5cb9a7}
  - text: В доклинических и клинических исследованиях вредного действия на сердечно-сосудистую систему не выявлено; QT маритупирдин не удлиняет.
    critical: false
    evidence:
    - {key: aviandr-ohlp/4.4/1, fingerprint: be08af5cb9a7}
  - text: С метопрололом маритупирдин не вызвал клинически значимого снижения ЧСС и давления.
    critical: false
    evidence:
    - {key: aviandr-ohlp/4.5/2, fingerprint: dac1149970ef}
  - text: 'Перед назначением исключают противопоказания: почечную недостаточность со СКФ ниже 60 мл/мин и печёночную недостаточность любой степени.'
    critical: true
    evidence:
    - {key: aviandr-ohlp/4.3/1, fingerprint: 3e8821a8afca}
  must_not: ['Утверждать, что Авиандр противопоказан при ХСН или брадикардии', 'Утверждать, что безопасность при ХСН доказана, без оговорки об осторожности']
  relevant:
  - {key: aviandr-ohlp/4.3/1, fingerprint: 3e8821a8afca, grade: 2}
  - {key: aviandr-ohlp/4.4/1, fingerprint: be08af5cb9a7, grade: 2}
