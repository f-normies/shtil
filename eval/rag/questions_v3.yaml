- id: s-226
  question: Чем ей лечить депрессию с учётом падений и с какой дозы начинать?
  patient: Ж, 81 год. Остеопороз, два падения за полгода. АГ, периндоприл 4 мг. Живёт одна. Три месяца почти не выходит из дома, потеряла аппетит, похудела на 4 кг, PHQ-9 14.
  type: case
  asker: терапевт
  style: full
  kind: multi
  split: dev
  points:
  - text: 'Одиноким пациентам с умеренным ДЭ лечение предпочтительнее в стационаре или полустационаре: выше риск резкого ухудшения и суицидальных мыслей.'
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_3/6, fingerprint: 74bc985f864a}
  - text: Нужна первичная консультация психиатра с оценкой риска суицидального поведения.
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_diag_2_1/1, fingerprint: db0a5cd907fb}
  - text: АД начинают с минимальной эффективной дозы и повышают постепенно.
