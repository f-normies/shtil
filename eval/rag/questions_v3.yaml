    - {key: kr-gad-2024/doc_b/2, fingerprint: 5c630e4c322f}
  - text: Курс бензодиазепинов ограничивают 3–4 неделями, не дольше 4 недель, из-за зависимости и синдрома отмены.
    critical: true
    evidence:
    - {key: kr-gad-2024/doc_3/4, fingerprint: cb97a80d852d}
  - text: Бензодиазепины не назначают при зависимости или риске зависимости от ПАВ и пожилым пациентам.
    critical: true
    evidence:
    - {key: kr-gad-2024/doc_3/4, fingerprint: cb97a80d852d}
  must_not: [Рекомендовать бензодиазепины дольше 4 недель без особых показаний, Пропустить оценку суицидального риска в первые недели приёма АД]
