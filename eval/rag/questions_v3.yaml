- id: s-153
  question: тревожный пациент с пароксизмами фп какой анксиолитик безопаснее для сердца
  type: reference
  asker: кардиолог
  style: short
  kind: multi
  split: dev
  points:
  - text: 'Авиандр: в исследованиях не выявлено вреда для сердечно-сосудистой системы, QT не удлиняет, холинолитического действия нет; но при ССЗ из-за нехватки данных — с осторожностью.'
    critical: true
    evidence:
    - {key: aviandr-ohlp/4.4/1, fingerprint: be08af5cb9a7}
  - text: Фабомотизол показан при тревоге у больных с аритмиями, ИБС и гипертонической болезнью; обычно 10 мг трижды в день, при необходимости до 60 мг/сут.
    critical: true
    evidence:
    - {key: afobazol-ohlp/4.1/1, fingerprint: e90da07264e0}
    - {key: afobazol-ohlp/4.2/1, fingerprint: d34d53b51e17}
  - text: Прегабалин не ингибирует CYP450 и не взаимодействует с варфарином, но у пожилых с ССЗ на нём описана ХСН — нужна осторожность.
    critical: true
    evidence:
    - {key: kr-gad-2024/doc_3/8, fingerprint: 72b0b50b1d7a}
    - {key: lyrica-ohlp/4.4/6, fingerprint: 6bfcf3e2c09b}
  - text: ТЦА (в КР ГТР — имипрамин) дают тахикардию и ортостатическую гипотензию; при ССЗ умеренной и выраженной тяжести ТЦА не назначают.
    critical: true
    evidence:
    - {key: kr-gad-2024/doc_3/11, fingerprint: 019d01959f48}
    - {key: kr-depression-2024/doc_3/3, fingerprint: fc05e9dc0fcd}
  - text: СИОЗС — препараты первого выбора при ССЗ, но высокие дозы циталопрама и эсциталопрама удлиняют QTc, а с антиагрегантами растёт риск кровотечений.
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_3/3, fingerprint: fc05e9dc0fcd}
  must_not: ['Утверждать, что корпус прямо сравнивает кардиобезопасность анксиолитиков при фибрилляции предсердий', Рекомендовать ТЦА пациенту с выраженным сердечно-сосудистым заболеванием, Называть Авиандр безопасным при ССЗ без оговорки об осторожности]
