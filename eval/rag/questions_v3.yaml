    - {key: kr-gad-2024/doc_a3/2, fingerprint: cd785714a683}
  - text: Тразодон чаще вызывает седацию и ортостатическую гипотензию, редко приапизм; миртазапин — прибавку веса и избыточную седацию.
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_3/7, fingerprint: 36665ebb6735}
    - {key: kr-depression-2024/doc_3/3, fingerprint: fc05e9dc0fcd}
  - text: Первая линия при ГТР — СИОЗС, венлафаксин или дулоксетин, агомелатин.
    critical: false
    evidence:
    - {key: kr-gad-2024/doc_3/3, fingerprint: 293140c7776d}
  must_not: [Выдать низкие «снотворные» дозы тразодона или миртазапина за рекомендацию КР, Называть тразодон или миртазапин препаратами первой линии при ГТР]
  relevant:
