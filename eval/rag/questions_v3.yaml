- id: s-045
  question: ад менять уже или сначала нормально довести прием
  patient: М, 37 лет. Тревожится почти постоянно девять месяцев. Эсциталопрам 10 мг/сут назначен шесть недель назад, но принимает три-четыре дня в неделю; заметного улучшения нет. Хроническая боль в пояснице, иногда ибупрофен.
