- id: s-220
  question: Подходит ли Авиандр при такой реакции на стресс или правильнее сразу начинать антидепрессант?
  patient: М, 45 лет. Три недели после потери работы — тревога, напряжение, сон по 4–5 часов, постоянные мысли о будущем. Сопутствующих заболеваний нет. GAD-7 11, PHQ-9 7.
  type: case
  asker: терапевт
  style: full
  kind: multi
  split: dev
  points:
  - text: Для диагноза ГТР тревога должна длиться не менее 6 месяцев; 3 недели после стрессора этому критерию не соответствуют.
    critical: false
    evidence:
    - {key: kr-gad-2024/doc_diag_2/1, fingerprint: 18c9123e763a}
  - text: Показания Авиандра — ГТР и тревожные состояния после COVID-19 со стрессовой реакцией и нарушением адаптации; реакция на потерю работы прямо не названа.
    critical: true
    evidence:
    - {key: aviandr-ohlp/4.1/1, fingerprint: f1bcbd30c133}
  - text: Если врач всё же назначает Авиандр — 20 мг 2 раза в сутки, курс 4 недели, при необходимости до 6.
    critical: true
    evidence:
    - {key: aviandr-ohlp/4.2/1, fingerprint: f1faaf4ce289}
  - text: При незначительно выраженной тревоге возможна психотерапия без лекарств.
    critical: false
    evidence:
    - {key: kr-gad-2024/doc_3/34, fingerprint: b0e34f7cf036}
  - text: Оценить суицидальный риск, чтобы определить вид и объём помощи.
    critical: true
    evidence:
    - {key: kr-gad-2024/doc_diag_2_1/10, fingerprint: 2bc474b52393}
  must_not: [Поставить диагноз ГТР при длительности тревоги 3 недели, 'Утверждать без оговорок, что стрессовая реакция любой причины входит в показания Авиандра', 'Утверждать, что КР требуют сразу начинать антидепрессант при такой реакции']
  relevant:
