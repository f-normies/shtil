- id: s-059
  question: Как выбрать лечение депрессии с учётом антикоагулянта и какие риски обсудить с пациентом?
  patient: М, 72 года. Два месяца подавленности, снижения аппетита и интересов, PHQ-9 — 18. Фибрилляция предсердий, принимает апиксабан и бисопролол. Антидепрессанты раньше не получал.
  type: case
  asker: кардиолог
  style: full
  kind: multi
  split: dev
  points:
  - text: Выбирать АД с учётом сопутствующего заболевания и апиксабана как текущей терапии.
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_3/1, fingerprint: 8e5cc598338f}
  - text: СИОЗС могут повышать риск кровотечений.
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_3/3, fingerprint: fc05e9dc0fcd}
  - text: При сердечно-сосудистой патологии препаратами первого выбора являются СИОЗС и другие АД новых поколений.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_3/3, fingerprint: fc05e9dc0fcd}
  must_not: [Самостоятельно снизить дозу апиксабана по этим КР., 'Заявить, что комбинация с апиксабаном специально признана безопасной в базе.']
  relevant:
