- id: s-175
  question: 'Депрессия с выраженной бессонницей: можно ли на первые недели добавить снотворное, или лучше сразу выбрать антидепрессант с седативным действием?'
  type: reference
  asker: невролог
  style: full
  kind: multi
  split: dev
  points:
  - text: Индивидуальный план лечения учитывает клинические особенности, в том числе нарушения сна.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_3/1, fingerprint: 8e5cc598338f}
  - text: АД различаются прежде всего профилем побочных эффектов, включая седацию; выраженнее седация у амитриптилина, миртазапина, миансерина и тразодона.
