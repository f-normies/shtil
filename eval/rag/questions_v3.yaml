    - {key: kr-depression-2024/doc_a3/5, fingerprint: 093f2f500c6b}
  - text: Миансерин действует преимущественно седативно; для миртазапина характерны прибавка веса и избыточная седация.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_3/7, fingerprint: 36665ebb6735}
    - {key: kr-depression-2024/doc_3/3, fingerprint: fc05e9dc0fcd}
