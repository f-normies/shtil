- id: s-064
  question: Можно ли продолжать Авиандр, если появилась сонливость, и что сказать о вождении?
  patient: М, 50 лет. Тревога и раздражительность два месяца. Авиандр 20 мг 2 раза в сутки принимает пять дней, стал сонливым днём; ежедневно водит автомобиль. АГ, принимает валсартан.
  type: case
  asker: кардиолог
  style: full
