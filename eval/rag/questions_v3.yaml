- id: s-057
  question: Нужно ли сначала исключить соматическую причину этих симптомов и какие обследования выбрать?
  patient: Ж, 40 лет. Шесть недель тревоги, сердцебиения, потливости и снижения веса. Хронических заболеваний не знает, лекарств и стимуляторов не принимает. Пульс в покое — 108 в минуту.
  type: case
