  question: три ад за год без толку или не перенесла — эст в 72 рассматриваем?
  patient: 'Ж, 72 года. Рекуррентная депрессия, текущий эпизод тяжёлый, PHQ-9 23. За год три антидепрессанта: эффекта нет либо отменены из-за гипонатриемии и падений. Суицидальных намерений не высказывает.'
  type: case
