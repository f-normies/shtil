- id: s-170
  question: гтр и бессонница — тразодон или миртазапин на ночь норм?
  type: reference
  asker: невролог
  style: short
  kind: multi
  split: dev
  points:
  - text: 'При ГТР с инсомнией КР рекомендуют комплексную медико-психологическую программу: 10 сессий КПТ и 10 психофизиологических сеансов за 5 недель.'
    critical: false
    evidence:
    - {key: kr-gad-2024/doc_3/39, fingerprint: 2751c971c7c4}
  - text: Тразодон (#, 150–400 мг/сут) в КР ГТР — только при рефрактерности к другим видам фармакотерапии.
    critical: true
    evidence:
    - {key: kr-gad-2024/doc_3/24, fingerprint: c4bfb4b6bb0d}
  - text: Миртазапин (#, 15–45 мг) есть только в таблице доз КР ГТР, отдельной рекомендации для него нет.
    critical: false
