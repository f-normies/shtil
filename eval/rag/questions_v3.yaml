- id: s-221
  question: два сиозс не перенесла, дальше что при гтр — лирика норм вариант?
  patient: Ж, 37 лет. ГТР около года, GAD-7 16. Эсциталопрам и сертралин отменены через 1–2 недели из-за выраженной тошноты и головокружения.
  type: case
  asker: невролог
  style: short
  kind: multi
  split: test
  points:
  - text: 'Вторая линия при ГТР: смена на неиспользованный АД первой линии или монотерапия прегабалином.'
    critical: false
    evidence:
    - {key: kr-gad-2024/doc_3/5, fingerprint: f4ea712bf22d}
  - text: При ГТР прегабалин начинают со 150 мг/сут и при переносимости еженедельно повышают до 300, 450 и максимум 600 мг/сут.
    critical: true
    evidence:
    - {key: kr-gad-2024/doc_3/8, fingerprint: 72b0b50b1d7a}
    - {key: lyrica-ohlp/4.2/1, fingerprint: df863c774367}
  - text: Прегабалин вызывает зависимость даже в терапевтических дозах; при склонности к зависимости от ПАВ его не назначают, нужен наркологический анамнез.
    critical: true
    evidence:
    - {key: lyrica-ohlp/4.4/4, fingerprint: e167e4aca090}
    - {key: kr-gad-2024/doc_3/8, fingerprint: 72b0b50b1d7a}
  - text: Самые частые нежелательные реакции прегабалина — головокружение и сонливость; это важно, раз СИОЗС отменили из-за головокружения.
    critical: false
    evidence:
    - {key: lyrica-ohlp/4.8/1, fingerprint: c44b9f7ae9dc}
  - text: 'Женщине репродуктивного возраста на прегабалине нужна эффективная контрацепция: приём в первом триместре может вызвать серьёзные пороки у плода.'
    critical: true
    evidence:
    - {key: lyrica-ohlp/4.4/5, fingerprint: 37afc8241ac9}
    - {key: lyrica-ohlp/4.6/1, fingerprint: d00cb8c8f38f}
  must_not: [Назначить прегабалин без оценки риска зависимости, Назвать дозу прегабалина вне диапазона 150–600 мг/сут, 'Утверждать, что прегабалин безопасен при беременности']
