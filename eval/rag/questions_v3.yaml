  - text: 'О фертильности есть только доклинические данные: вредного влияния на мужскую и женскую фертильность не выявлено.'
    critical: false
    evidence:
    - {key: aviandr-ohlp/4.6/1, fingerprint: 7cb693c1639b}
  - text: Комбинированные оральные контрацептивы, по ОХЛП, значимо не меняют фармакокинетику маритупирдина.
    critical: false
    evidence:
    - {key: aviandr-ohlp/4.5/3, fingerprint: 99162db16d68}
  - text: Перед планированием беременности Авиандр можно отменить без постепенного снижения дозы.
    critical: false
    evidence:
    - {key: aviandr-ohlp/4.2/1, fingerprint: f1faaf4ce289}
  must_not: ['Утверждать, что Авиандр можно продолжать при беременности или после зачатия', 'Выдумать срок отмены перед зачатием, которого нет в ОХЛП', 'Утверждать, что есть клинические данные о влиянии на фертильность человека']
  relevant:
  - {key: aviandr-ohlp/4.2/1, fingerprint: f1faaf4ce289, grade: 2}
