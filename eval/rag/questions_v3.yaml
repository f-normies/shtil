- id: s-267
  question: эсциталопрам плюс трамадол — серотониновый синдром реально грозит? чем обезболить вместо
  patient: Ж, 44 года. Депрессия, эсциталопрам 15 мг, ремиссия. Из-за радикулопатии хирург назначил трамадол 50 мг до 4 раз в день.
  type: case
  asker: невролог
  style: short
  kind: multi
  split: test
  points:
  - text: Эсциталопрам с опиоидами, включая трамадол, может вызвать серотониновый синдром; такое сочетание требует осторожности.
    critical: true
    evidence:
    - {key: cipralex-ohlp/4.5/2, fingerprint: a580895bc3e9}
    - {key: cipralex-ohlp/4.4/4, fingerprint: 95c9e105765a}
  - text: Признаки серотонинового синдрома — ажитация, тремор, миоклонус, гипертермия; при них оба препарата сразу отменяют и лечат симптоматически.
    critical: true
    evidence:
    - {key: cipralex-ohlp/4.4/4, fingerprint: 95c9e105765a}
  - text: И СИОЗС, и трамадол снижают порог судорожной готовности, поэтому их совместный приём требует осторожности.
    critical: false
    evidence:
    - {key: cipralex-ohlp/4.5/3, fingerprint: 51f1c153a4a3}
  - text: НПВП вместе с эсциталопрамом повышают склонность к кровотечениям.
    critical: false
    evidence:
    - {key: cipralex-ohlp/4.5/3, fingerprint: 51f1c153a4a3}
  - text: Прегабалин по ОХЛП показан взрослым при нейропатической боли, периферической и центральной.
    critical: false
    evidence:
    - {key: lyrica-ohlp/4.1/1, fingerprint: c9ea0f7ca32f}
  must_not: ['Утверждать, что сочетание эсциталопрама с трамадолом безопасно', Выдать за содержание документов готовую схему обезболивания радикулопатии, Предложить НПВП без оговорки о риске кровотечений на эсциталопраме]
  relevant:
