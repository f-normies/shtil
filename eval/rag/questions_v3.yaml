  - {key: kr-depression-2024/doc_4/2, fingerprint: cdcf15d2f937, grade: 1}
  - {key: kr-depression-2024/doc_v/1, fingerprint: 0952b6d33d5a, grade: 2}
  note: 'Частичный ответ: апиксабан-специфического алгоритма нет. Фрагмент о повышенном риске сочетаний относится к антиагрегантам; апиксабан — антикоагулянт, и прямую цитату о его комбинации подменять нельзя.'
- id: s-060
  question: Как вести пациента, если после самостоятельной отмены появились такие симптомы? Нужно ли пересмотреть способ отмены?
  patient: Ж, 36 лет. Лечилась от ГТР пароксетином 20 мг/сут девять месяцев, последние три месяца чувствовала себя хорошо. Четыре дня назад резко прекратила приём; появились головокружение, тошнота и ощущения разрядов в голове. Сопутствующих заболеваний и других препаратов нет.
  type: case
  asker: терапевт
  style: full
  kind: multi
  split: dev
  points:
  - text: Синдром отмены особенно характерен для пароксетина; временная связь с прекращением требует его оценки.
    critical: false
    evidence:
    - {key: kr-gad-2024/doc_3/31, fingerprint: d7201bc74d74}
  - text: Дальнейшее прекращение планировать постепенно, с индивидуальным темпом.
    critical: true
    evidence:
    - {key: kr-gad-2024/doc_3/31, fingerprint: d7201bc74d74}
    - {key: kr-gad-2024/doc_b/3, fingerprint: b58d5d694b12}
  - text: При лёгком синдроме отмены медикаментозная коррекция не показана.
    critical: false
    evidence:
    - {key: kr-gad-2024/doc_b/3, fingerprint: b58d5d694b12}
  - text: При умеренном синдроме отмены предусмотрена симптоматическая терапия.
    critical: false
    evidence:
    - {key: kr-gad-2024/doc_b/3, fingerprint: b58d5d694b12}
  - text: При тяжёлом синдроме возможен возврат к дозе без симптомов отмены с последующим более дробным и медленным снижением.
    critical: false
    evidence:
    - {key: kr-gad-2024/doc_b/3, fingerprint: b58d5d694b12}
  must_not: [Без оценки считать это обязательным рецидивом ГТР., Возобновить препарат в высокой дозе независимо от тяжести и состояния.]
  relevant:
