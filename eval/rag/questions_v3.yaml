  - text: Пациента заранее предупреждают о побочных эффектах начала терапии, а в первые недели наблюдают, оценивая суицидальный риск и усиление тревоги.
    critical: true
    evidence:
    - {key: kr-gad-2024/doc_3/3, fingerprint: 293140c7776d}
  - text: При выраженной тревоге и вегетативных симптомах на первом этапе допустим короткий курс бензодиазепинов вместе с АД.
