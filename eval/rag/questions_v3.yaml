    evidence:
    - {key: kr-depression-2024/doc_crat_info_1_6/1, fingerprint: 5d5274ea4d02}
  - text: ДЭ диагностируют, только если эпизод нельзя объяснить ПАВ или органическим психическим расстройством.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_diag_2/1, fingerprint: fa6894b8e3dc}
  - text: При трудностях дифференциальной диагностики рекомендованы консультация медицинского психолога и патопсихологическое исследование.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_diag_2_5/2, fingerprint: 172551e07a89}
  - text: Для дифференциальной диагностики по показаниям проводят ЭЭГ, МРТ (предпочтительно) или КТ головного мозга и консультацию невролога.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_diag_2_4/2, fingerprint: 0aa7fdd55826}
    - {key: kr-depression-2024/doc_diag_2_5/3, fingerprint: 8760ef2b6bd0}
    - {key: kr-depression-2024/doc_diag_2_5/4, fingerprint: f590fe8387d2}
  - text: ТЦА не назначают при когнитивных нарушениях и делирии; у пожилых они могут вызывать делирий.
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_3/3, fingerprint: fc05e9dc0fcd}
  must_not: ['Выдать нейропсихологические шкалы или пороги (MMSE, MoCA) за содержание КР', Рекомендовать ТЦА пожилому пациенту с когнитивными нарушениями]
  relevant:
