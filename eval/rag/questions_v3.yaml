- id: s-150
  question: резистентная депра чем аугментировать по кр — литий или атипик
  type: reference
  asker: психиатр
  style: short
  kind: multi
  split: dev
  points:
  - text: КР допускают обе стратегии; для аугментации АВП названы кветиапин, арипипразол, оланзапин с флуоксетином, рисперидон 0,25–3 мг/сут.
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_3/29, fingerprint: 7953bde9a5db}
  - text: 'Арипипразол: старт 5 мг/сут, максимум 15 мг/сут; кветиапин: старт 50 мг/сут, не выше 600 мг/сут.'
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_3/31, fingerprint: 5788f4fbdbd2}
  - text: 'Литий: карбонат лития от 800 мг/сут или до концентрации в сыворотке от 0,5; диапазон узкий, уровень лития регулярно контролируют.'
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_3/32, fingerprint: e437155ee314}
  - text: Любой АВП добавляет побочные эффекты — гиперпролактинемию, метаболические нарушения, экстрапирамидные симптомы; нужна оценка пользы и риска.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_3/31, fingerprint: 5788f4fbdbd2}
  - text: Перед аугментацией перепроверяют диагноз (в том числе возможный БАР II), дозу и комплаентность.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_3/21, fingerprint: 5dd21744b89d}
