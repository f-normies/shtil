  - text: В помощь анамнезу возможно использование HCL-33.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_diag_2_1/5, fingerprint: f1759e17a35a}
  must_not: [Считать БАР исключённым и назначить АД только на основании текущей подавленности., Без уточнения объявить описанные прошлые периоды доказанной манией.]
