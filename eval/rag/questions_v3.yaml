  - text: 'Если три этапа не помогли, это резистентность: уточняют диагноз, коморбидность, комплаентность и дообследуют.'
    critical: false
    evidence:
    - {key: kr-gad-2024/doc_3/16, fingerprint: 4f1e34a57d09}
  - text: При рефрактерности к лекарствам и психотерапии добавляют транскраниальную магнитную стимуляцию.
