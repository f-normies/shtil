- id: s-265
  question: при пропусках золофта ей плохо — это депра возвращается или отмена? как ей объяснить
  patient: Ж, 47 лет. Депрессия, сертралин 100 мг год, ремиссия. Периодически забывает таблетки на 2–3 дня — тогда головокружение, раздражительность, состояние «как при гриппе».
  type: case
  asker: терапевт
  style: short
  kind: multi
  split: dev
  points:
  - text: 'Ухудшение при пропусках похоже на синдром отмены АД: он обычно преходящ и быстро проходит после возобновления приёма.'
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_3/53, fingerprint: d107d77db7ab}
  - text: Риск синдрома отмены выше при большей дозе и длительном приёме; среди СИОЗС он характерен для препаратов с коротким периодом полувыведения.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_3/53, fingerprint: d107d77db7ab}
  - text: Пациентке нужно объяснить, зачем принимать препарат регулярно и что делать при пропуске, и договориться о строгом соблюдении схемы.
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_v/1, fingerprint: 0952b6d33d5a}
  - text: Лёгкий синдром отмены лекарств не требует — достаточно объяснить, что симптомы временные.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_b/2, fingerprint: 56604cae17d4}
  - text: Важно определить индивидуальные ранние признаки рецидива и мотивировать пациентку обращаться к врачу при их появлении.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_v/1, fingerprint: 0952b6d33d5a}
  must_not: [Расценить симптомы как рецидив и повысить дозу без оценки, Посоветовать резко отменить сертралин]
