- id: s-169
  question: Если курс Авиандра закончился, а через пару месяцев тревога вернулась, можно ли назначить повторный курс?
  type: reference
  asker: терапевт
  style: full
  kind: multi
  split: dev
  points:
  - text: При ГТР, заболевании с хроническим течением, длительность лечения Авиандром определяет врач.
    critical: false
    evidence:
    - {key: aviandr-ohlp/4.2/1, fingerprint: f1faaf4ce289}
  - text: При тревожных состояниях, в том числе после COVID-19, курс — 4 недели, при необходимости до 6 недель.
    critical: true
    evidence:
    - {key: aviandr-ohlp/4.2/1, fingerprint: f1faaf4ce289}
  - text: Доза — по 20 мг дважды в день, утром и вечером, за полчаса до еды.
    critical: true
    evidence:
    - {key: aviandr-ohlp/4.2/1, fingerprint: f1faaf4ce289}
  - text: Длительные эффекты маритупирдина не изучены.
    critical: false
    evidence:
    - {key: kr-gad-2024/doc_3/15, fingerprint: 2fb26170ba7b}
  - text: 'Возврат тревоги после короткого курса ожидаем: при ГТР терапию продолжают не менее 6 месяцев после наступления эффекта.'
    critical: true
    evidence:
    - {key: kr-gad-2024/doc_3/30, fingerprint: d37f8be1f94d}
  must_not: ['Утверждать, что ОХЛП запрещает повторный курс', Выдумать обязательный интервал между курсами, 'Утверждать, что эффективность длительного применения доказана']
