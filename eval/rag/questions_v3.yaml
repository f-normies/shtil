- id: s-223
  question: хочет слезть с феназепама на авиандр — сразу менять или сначала феназепам снижать
  patient: М, 35 лет. Тревога около полугода. Феназепам 1 мг 3 раза в день принимает 3 месяца, начал сам по совету знакомых. Хочет «что-нибудь без привыкания».
  type: case
  asker: терапевт
  style: short
  kind: multi
  split: test
  points:
  - text: Производные бензодиазепина вызывают зависимость и синдром отмены при резком прекращении, поэтому феназепам резко не отменяют.
    critical: true
    evidence:
    - {key: kr-gad-2024/doc_3/4, fingerprint: cb97a80d852d}
  - text: Курс бензодиазепинов ограничивают короткими сроками, не более 4 недель; у пациента он уже превышен.
    critical: false
    evidence:
    - {key: kr-gad-2024/doc_3/4, fingerprint: cb97a80d852d}
  - text: Феназепам из-за длительного периода полувыведения назначают не чаще 1–2 раз в сутки.
    critical: true
    evidence:
    - {key: kr-gad-2024/doc_3/4, fingerprint: cb97a80d852d}
  - text: Маритупирдин может усиливать седативный эффект бензодиазепинов, совместное назначение требует осторожности.
    critical: true
    evidence:
    - {key: aviandr-ohlp/4.5/1, fingerprint: 26491090dfd3}
  - text: По КР маритупирдин не обладает аддиктивным потенциалом, но ОХЛП допускает зависимость и отмену, как у любого психотропного препарата.
    critical: false
    evidence:
    - {key: kr-gad-2024/doc_3/15, fingerprint: 2fb26170ba7b}
    - {key: aviandr-ohlp/4.4/1, fingerprint: be08af5cb9a7}
  must_not: [Рекомендовать резко отменить феназепам и сразу перевести на Авиандр, 'Утверждать, что у Авиандра риск зависимости полностью исключён', 'Выдумать схему снижения феназепама, выдав её за содержание КР']
