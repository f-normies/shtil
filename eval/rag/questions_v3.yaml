  question: Имеет ли смысл перевести его с прегабалина на маритупирдин и как сделать это без возврата тревоги?
  patient: М, 48 лет. ГТР, прегабалин 150 мг 2 раза в день 2 месяца. GAD-7 снизился с 18 до 12. Жалуется на сонливость и прибавку веса.
