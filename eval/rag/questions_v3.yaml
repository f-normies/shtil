  question: постинсультная депра — когда начинать ад и какой предпочесть
  type: reference
  asker: невролог
  style: short
  kind: multi
  split: dev
  points:
  - text: СИОЗС и другие АД новых поколений КР называют препаратами первого выбора при сердечно-сосудистых заболеваниях.
