- id: s-151
  question: шкала бека пациент сам заполняет — можно на нее опираться или нужна врачебная
  type: reference
  asker: кардиолог
  style: short
  kind: multi
  split: test
  points:
  - text: В КР ГТР шкала тревоги Бека (BAI) названа среди опросников, которые применяют для скрининга тревоги и наблюдения за её динамикой.
