- id: s-162
  question: Как отличить депрессию у пожилого пациента от начинающейся деменции, если на первом плане жалобы на память?
  type: reference
  asker: невролог
  style: full
  kind: multi
  split: test
  points:
  - text: Сниженная способность к сосредоточению и вниманию — один из симптомов ДЭ.
