- id: s-222
  question: Какой антидепрессант можно назначить при грудном вскармливании и нужно ли прекращать кормление?
  patient: Ж, 34 года. Два месяца после родов, грудное вскармливание. Плаксивость, чувство вины, бессонница даже когда ребёнок спит. PHQ-9 17, в 9-м пункте 0.
