    critical: false
    evidence:
    - {key: kr-depression-2024/doc_3/3, fingerprint: fc05e9dc0fcd}
  - text: Производные бензодиазепина несут риск зависимости.
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_3/13, fingerprint: 14cbc39d28d8}
