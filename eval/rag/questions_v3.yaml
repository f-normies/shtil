- id: s-262
  question: На время эрадикации Авиандр лучше прервать, снизить дозу или оставить как есть?
  patient: 'Ж, 42 года. ГТР, Авиандр 20 мг 2 раза в день 3 недели, переносит хорошо. Гастроэнтеролог назначил эрадикацию H. pylori: кларитромицин, амоксициллин, омепразол на 14 дней.'
  type: case
  asker: терапевт
  style: full
  kind: multi
  split: dev
  points:
  - text: Омепразол как ингибитор CYP2C19 значимо не меняет фармакокинетику маритупирдина.
    critical: false
    evidence:
    - {key: aviandr-ohlp/4.5/3, fingerprint: 99162db16d68}
  - text: По доклиническим данным маритупирдин метаболизируется через CYP2D6, поэтому осторожность нужна с ингибиторами CYP2D6; кларитромицин и амоксициллин в ОХЛП не упомянуты.
    critical: false
    evidence:
    - {key: aviandr-ohlp/4.5/2, fingerprint: dac1149970ef}
  - text: Режим один — 20 мг дважды в день; сниженной дозы ОХЛП не предусматривает.
    critical: true
    evidence:
    - {key: aviandr-ohlp/4.2/1, fingerprint: f1faaf4ce289}
  - text: Если приём всё же прерывают, постепенно снижать дозу не нужно.
    critical: false
    evidence:
    - {key: aviandr-ohlp/4.2/1, fingerprint: f1faaf4ce289}
  must_not: [Выдумать взаимодействие маритупирдина с кларитромицином или амоксициллином, Предложить сниженную дозу Авиандра]
  relevant:
  - {key: aviandr-ohlp/4.2/1, fingerprint: f1faaf4ce289, grade: 2}
  - {key: aviandr-ohlp/4.5/2, fingerprint: dac1149970ef, grade: 2}
  - {key: aviandr-ohlp/4.5/3, fingerprint: 99162db16d68, grade: 2}
  - {key: aviandr-ohlp/5.2/2, fingerprint: e186feab02ce, grade: 1}
