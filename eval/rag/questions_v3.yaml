    critical: true
    evidence:
    - {key: kr-gad-2024/doc_3/6, fingerprint: bd9cbf8cfd20}
  - text: Обсудить регулярность приёма, отсроченный эффект и возможные побочные явления.
    critical: false
    evidence:
    - {key: kr-gad-2024/doc_3/6, fingerprint: bd9cbf8cfd20}
  - text: Шесть календарных недель нерегулярного приёма не доказывают неэффективность адекватного курса.
    critical: false
    evidence:
    - {key: kr-gad-2024/doc_3/6, fingerprint: bd9cbf8cfd20}
  - text: При ГТР эсциталопрам принимают ежедневно однократно, обычно 10 мг, с возможным повышением до максимума 20 мг/сут.
    critical: true
    evidence:
    - {key: cipralex-ohlp/4.2/1, fingerprint: f7fed8287f68}
    - {key: cipralex-ohlp/4.2/2, fingerprint: 46898baeb3a9}
  - text: Ибупрофен как НПВП вместе с эсциталопрамом может повысить склонность к кровотечениям — нужна осторожность.
    critical: true
