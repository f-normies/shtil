- id: s-156
  question: В каких случаях терапевт должен направить пациента с депрессией к психиатру, даже если суицидальных мыслей нет?
  type: reference
  asker: терапевт
  style: full
  kind: multi
  split: dev
  points:
  - text: По КР первичную оценку депрессивного синдрома и диагноз проводит врач-психиатр — консультация психиатра рекомендована всем пациентам, независимо от суицидальных мыслей.
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_diag_2/1, fingerprint: fa6894b8e3dc}
    - {key: kr-depression-2024/doc_diag_2_1/1, fingerprint: db0a5cd907fb}
  - text: Тяжёлый ДЭ, с психотическими симптомами или без, — показание к стационарному лечению.
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_6/1, fingerprint: 29914359d363}
  - text: Одинокий пациент без поддержки близких с риском резкого ухудшения — показание к стационару при любой тяжести депрессии.
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_6/1, fingerprint: 29914359d363}
  - text: 'Признаки гипомании или смешанных черт требуют специализированной тактики: монотерапию АД при смешанных чертах не применяют.'
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_3/13, fingerprint: 14cbc39d28d8}
  - text: Даже лёгкий и средний ДЭ при низком суицидальном риске КР предлагают лечить амбулаторно в психоневрологическом диспансере.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_6/1, fingerprint: 29914359d363}
  must_not: ['Утверждать, что без суицидальных мыслей терапевт может сам ставить диагноз и вести любой ДЭ без психиатра', Советовать монотерапию АД при признаках гипомании или смешанных черт]
  relevant:
