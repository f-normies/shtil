- id: s-256
  question: 'Как вести пациентку со смешанными чертами: допустима ли здесь монотерапия антидепрессантом?'
  patient: Ж, 42 года. Депрессия, PHQ-9 20. Одновременно раздражительность, ускоренная речь, наплыв мыслей, мало спит без чувства усталости. В анамнезе два депрессивных эпизода.
