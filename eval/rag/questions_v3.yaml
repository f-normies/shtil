- id: s-159
  question: Сколько продолжать поддерживающую терапию при рекуррентном депрессивном расстройстве после третьего эпизода?
  type: reference
  asker: терапевт
  style: full
  kind: multi
  split: test
  points:
  - text: После купирования проводят стабилизирующую терапию тем же АД в прежней дозе 4–6 месяцев.
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_3/47, fingerprint: d18ae93ef6f2}
  - text: При РДР рекомендована непрерывная профилактическая терапия не менее 3–5 лет в дозах, которые были эффективны при купировании и стабилизации.
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_3/49, fingerprint: f41bb636c773}
  - text: Риск обострений растёт с числом перенесённых эпизодов, а снижение дозы ослабляет профилактический эффект.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_3/52, fingerprint: fea4e08cb7ba}
  - text: При частых рецидивах и тяжёлых эпизодах АД продолжают в полной дозе; сниженную дозу или отмену допускают лишь при лёгких или редких (≤2 за 5 лет) эпизодах.
    critical: true
    evidence:
    - {key: kr-depression-2024/doc_3/52, fingerprint: fea4e08cb7ba}
  - text: Завершают профилактическую терапию постепенным снижением дозы, чтобы избежать синдрома отмены.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_3/53, fingerprint: d107d77db7ab}
