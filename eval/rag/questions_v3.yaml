    - {key: kr-depression-2024/doc_3/3, fingerprint: fc05e9dc0fcd}
  - text: Обсудить переносимость и возможность смены АД при её неприемлемости.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_3/24, fingerprint: 5329ce737f56}
  - text: Рекомендована консультация уролога при мужских сексуальных жалобах.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_diag_2_5/3, fingerprint: 8760ef2b6bd0}
    - {key: kr-depression-2024/doc_diag_2_5/4, fingerprint: f590fe8387d2}
  - text: 'Не прекращать АД резко: при плановом прекращении дозу снижают постепенно.'
    critical: true
