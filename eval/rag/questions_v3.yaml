- id: s-269
  question: сертралин 50 месяц почти без сдвига дозу поднять или менять ад
  patient: М, 46 лет. Депрессия, сертралин 50 мг 4 недели, принимает регулярно, переносит хорошо. PHQ-9 18 → 17.
  type: case
  asker: терапевт
  style: short
  kind: multi
  split: dev
  points:
