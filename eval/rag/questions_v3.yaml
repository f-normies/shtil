- id: s-168
  question: Как отличить нормальную реакцию горя от депрессивного эпизода у пациента, который недавно потерял близкого?
  type: reference
  asker: психиатр
  style: full
  kind: multi
  split: test
  points:
  - text: Для ДЭ нужны минимум два из трёх типичных симптомов — сниженное настроение, утрата интересов, повышенная утомляемость — и другие общие симптомы.
    critical: false
    evidence:
    - {key: kr-depression-2024/doc_diag_2/4, fingerprint: 33aade2c68e4}
  - text: Минимальная длительность эпизода — две недели.
    critical: false
