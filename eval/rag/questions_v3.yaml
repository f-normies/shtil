  - {key: kr-depression-2024/doc_diag_2_5/3, fingerprint: 8760ef2b6bd0, grade: 2}
  - {key: kr-depression-2024/doc_diag_2_5/4, fingerprint: f590fe8387d2, grade: 2}
  note: Критериев разграничения депрессии и деменции у пожилых в корпусе нет; ответ собран из общих требований к диагностике ДЭ.
- id: s-163
  question: gad-7 для контроля эффекта годится или он только для скрининга
