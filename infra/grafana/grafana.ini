# Grafana локального стенда. Лежит в образе grafana.
# Остальное — значения по умолчанию из /usr/share/grafana/conf/defaults.ini.
# Пароль admin — GRAFANA_ADMIN_PASSWORD из .env. Он применяется только при создании
# тома grafana_data.

[server]
# Порт публикуется только на 127.0.0.1 (compose.yaml).
domain = localhost
http_port = 3000

[security]
# Локально по HTTP, без сертификата.
cookie_secure = false
disable_gravatar = true

[users]
allow_sign_up = false
allow_org_create = false

# Дашборд открывается без входа: Grafana доступна только с этой машины,
# в метриках нет персональных данных. Правка — только под admin.
[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer
hide_version = true

# Без внешних запросов: статистика, проверка обновлений, новости, внешние снимки,
# каталог и предустановка плагинов, ключи подписей плагинов, перенос в Grafana Cloud.
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[snapshots]
external_enabled = false

[plugins]
preinstall_disabled = true
plugin_admin_enabled = false
public_key_retrieval_disabled = true

[cloud_migration]
enabled = false
