# Препараты с седативными свойствами по ОХЛП «Авиандра» 4.5: производные бензодиазепина,
# нейролептики, барбитураты, блокаторы H1-рецепторов. Листок-вкладыш (раздел 2, «Другие
# препараты») добавляет снотворные (зопиклон, золпидем, доксиламин) и противоаллергические
# (цетиризин). Перечня по названиям в ОХЛП нет: состав — решение ревью #76, классы взяты
# целиком. Медик подтвердит его при переводе карточки в `reviewed` (#82).
# Из блокаторов H1 второго поколения в группе только цетиризин: его называет листок.
# МНН — как в снимке ГРЛС: у феназепама и гидазепама МНН записан химическим названием.
id: sedative
title: "Препараты с седативными свойствами"
