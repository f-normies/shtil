# Серотонинергические препараты по перечню ОХЛП «Авиандра» 4.5: L-триптофан, триптаны,
# трамадол, СИОЗС, трициклические антидепрессанты, литий, фентанил, зверобой. Перечень в
# ОХЛП дан примерами, вывод раздела — осторожность «с другими серотонинергическими
# препаратами» в целом, уровень «желательно». Листок-вкладыш (раздел 2, «Другие препараты»)
# называет также опиоидные анальгетики. Всё, что сверх перечня 4.5, — решение ревью #76;
# медик подтвердит состав при переводе карточки в `reviewed` (#82).
# Зверобой — все написания МНН в снимке ГРЛС, кроме гомеопатической настойки: иначе
# выбранный врачом МНН давал бы молчаливый `pass`.
id: serotonergic
title: "Препараты с серотонинергическим действием"
inn:
  # Перечень 4.5.
  - "триптофан"
  - "суматриптан"
  - "золмитриптан"
  - "элетриптан"
  - "наратриптан"
  - "ризатриптан"
  - "трамадол"
  - "флуоксетин"
  - "сертралин"
  - "пароксетин"
  - "флувоксамин"
  - "циталопрам"
  - "эсциталопрам"
  - "амитриптилин"
  - "имипрамин"
  - "кломипрамин"
  - "лития карбонат"
  - "фентанил"
  - "зверобоя продырявленного трава"
  # Решение ревью #76: другие написания зверобоя.
  - "зверобоя трава"
  - "зверобоя продырявленного травы экстракт"
  - "зверобоя травы экстракт"
  - "зверобоя травы экстракт сухой"
  # Решение ревью #76: трициклические антидепрессанты сверх перечня.
  - "пипофезин"
  - "доксепин"
  # Решение ревью #76: ИОЗСН и другие серотонинергические антидепрессанты и анксиолитики.
  - "венлафаксин"
  - "дулоксетин"
  - "милнаципран"
  - "вортиоксетин"
  - "тразодон"
  - "миртазапин"
  - "миансерин"
  - "буспирон"
  # Решение ревью #76: опиоидный анальгетик (листок, раздел 2) и декстрометорфан.
  # Декстрометорфан есть в снимке только в комбинациях: группа находит его по компоненту.
  - "тапентадол"
  - "декстрометорфан"
sources:
