# Алерт по пункту 3 HAMD-17 «Суицидальные намерения» (#8): 3 — суицидальные высказывания или
# жесты, 4 — попытка самоубийства. Высокий суицидальный риск — показание к стационару при любой
# тяжести депрессии (КР, раздел 6), поэтому правило не зависит от суммы HAMD-17.
# Ответы 1–2 (малоценность жизни, мысли о смерти) алерт не поднимают: врач видит балл пункта
# и учитывает его при оценке риска. По самоотчёту тот же риск ловит phq9-suicidal-thoughts.
id: hamd17-suicidal-intent
version: 2
status: reviewed
kind: alert
level: mandatory
title: "Суицидальные высказывания, жесты или попытка (HAMD-17, пункт 3)"
when:
  any:
    - {scale: hamd-17, item: q3, op: ">=", value: 3}
doctor_actions:
  - "Оценить суицидальный риск: мысли, намерения, план, прошлые попытки, доступ к средствам"
  - "При высоком риске — психиатр, рассмотреть стационар"
sources:
  - {source: kr-depression-2024, locator: "раздел 2.5: обследование для выявления факторов риска суицида — всем пациентам, УУР B (УДД 2)"}
  - {source: kr-depression-2024, locator: "раздел 3.1.3: ДЭ с высоким суицидальным риском — лечение в стационаре, УУР B (УДД 1)"}
  - {source: kr-depression-2024, locator: "раздел 6: высокий суицидальный риск — показание к стационарному лечению независимо от степени тяжести депрессии"}
  - {source: kr-depression-2024, locator: "прил. Г1, пункт 3 «Суицидальные намерения»: 3 — суицидальные высказывания или жесты, 4 — попытки самоубийства"}
cases:
  - {given: {hamd-17: {q3: 2}}, fires: false, source: {source: kr-depression-2024, locator: "прил. Г1, пункт 3: 2 — желание смерти или мысли о возможности собственной смерти"}}
  - {given: {hamd-17: {q3: 3}}, fires: true, source: {source: kr-depression-2024, locator: "прил. Г1, пункт 3: 3 — суицидальные высказывания или жесты"}}
  - {given: {hamd-17: {q3: 4}}, fires: true, source: {source: kr-depression-2024, locator: "прил. Г1, пункт 3: 4 — попытки самоубийства"}}
  - {given: {hamd-17: {q3: 3, total: 10}}, fires: true, source: {source: kr-depression-2024, locator: "раздел 6: высокий суицидальный риск — независимо от степени тяжести депрессии"}}
  - {given: {hamd-17: {q3: 0, total: 25}}, fires: false, source: {source: kr-depression-2024, locator: "раздел 6: условие — суицидальный риск; тяжесть депрессии — правило routing-depression-severe"}}
  - {given: {}, fires: false, source: {source: kr-depression-2024, locator: "прил. Г1: без оценки по HAMD-17 сигнала нет"}}
