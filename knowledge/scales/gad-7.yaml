# GAD-7 — шкала генерализованного тревожного расстройства (#6).
# Использовать GAD-7 для скрининга тревоги рекомендуют КР «Генерализованное тревожное
# расстройство» (kr-gad-2024, прил. Г2; УУР B, УДД 3). Текст пунктов и пороги — по
# валидированному переводу Золотаревой (с. 39): текст в прил. Г2 КР отличается от него.
# Ограничение валидации (с. 38): популяционная выборка; в клинической практике — с
# осторожностью, нет данных о чувствительности и специфичности.
id: gad-7
version: 1
title: "Шкала генерализованного тревожного расстройства (GAD-7)"
purpose: screening
respondent: patient
status: reviewed
license:
  terms: "Pfizer: разрешение на перевод, воспроизведение и распространение не требуется. Русский перевод — Золотарева А.А., CC BY-NC 4.0."
  allowed: true
  source: {source: zolotareva-gad7-2023, locator: "с. 34"}
validation:
  - {source: zolotareva-gad7-2023, locator: "с. 31–46; ограничения — с. 38"}
instruction: "Оцените, пожалуйста, насколько часто следующие проблемы беспокоили вас в течение прошедших двух недель."
items:
  - id: q1
    text: "Чувство тревоги или раздражения"
    options: &freq
      - {value: 0, text: "Совсем нет"}
      - {value: 1, text: "В течение нескольких дней"}
      - {value: 2, text: "Более чем половину этого времени"}
      - {value: 3, text: "Почти каждый день"}
  - {id: q2, text: "Неспособность справиться со своим беспокойством", options: *freq}
  - {id: q3, text: "Чрезмерное беспокойство по разным поводам", options: *freq}
  - {id: q4, text: "Неспособность расслабляться", options: *freq}
  - {id: q5, text: "Ощущение такого беспокойства, что трудно найти себе место", options: *freq}
  - {id: q6, text: "Склонность быстро испытывать злость или раздражительность", options: *freq}
  - {id: q7, text: "Чувство страха, как будто может случиться что-то ужасное", options: *freq}
scores:
  - id: total
    items: [q1, q2, q3, q4, q5, q6, q7]
    bands:
      # Нижняя граница 0–4 совпадает с ключом КР (прил. Г2: «0–4 Минимальный»).
      - {min: 0, max: 4, code: minimal, label: "Минимальная тревога", source: {source: kr-gad-2024, locator: "прил. Г2, ключ"}}
      - {min: 5, max: 9, code: mild, label: "Лёгкая тревога", source: {source: zolotareva-gad7-2023, locator: "с. 39, ключи"}}
      # ≥ 10 — вероятный диагноз ГТР (с. 39).
      - {min: 10, max: 14, code: moderate, label: "Умеренная тревога", source: {source: zolotareva-gad7-2023, locator: "с. 39, ключи"}}
      - {min: 15, max: 21, code: severe, label: "Тяжёлая тревога", source: {source: zolotareva-gad7-2023, locator: "с. 39, ключи"}}
