# HAMD-17 — шкала Гамильтона для оценки депрессии, заполняет врач (#6).
# Текст и ключ — по КР «Депрессивный эпизод, РДР» (kr-depression-2024, прил. Г1).
# Отдельного исследования валидации русской версии не найдено. Основной источник в
# validation — КР: русский текст и ключ. Оригинал Гамильтона (валидация самой шкалы) —
# международный источник, только дополнение. КР ссылаются только на оригиналы
# (Hamilton 1967; Williams 1988). Ограничение назвать в презентации.
# В ключе КР «19–22 — тяжёлое, более 23 — крайне тяжёлое»: балл 23 не покрыт. По решению
# медика 23 отнесён к крайне тяжёлой степени (при неоднозначности — не занижать тяжесть).
id: hamd-17
version: 1
title: "Шкала Гамильтона для оценки депрессии (HAMD-17)"
purpose: monitoring
respondent: clinician
status: reviewed
license:
  terms: "Общественное достояние по данным NINDS Common Data Elements (по вторичным источникам; первоисточник не открыт). Русский текст воспроизведён в КР Минздрава."
  allowed: true
  source: {source: kr-depression-2024, locator: "прил. Г1"}
validation:
  - {source: hamilton-hamd-1967, locator: "оригинальная шкала и её валидация"}
  - {source: kr-depression-2024, locator: "прил. Г1: русский текст шкалы; исследования валидации русской версии не найдено"}
instruction: "Период оценки — неделя, предшествующая опросу, кроме пунктов 8, 9 (во время опроса) и 16 (перед эпизодом). Для каждого пункта выберите одно выражение, которое лучше всего характеризует пациента."
items:
  - id: q1
    text: "Сниженное настроение (переживания подавленности или печали, безнадежности, беспомощности, собственной малоценности)"
    options:
      - {value: 0, text: "Отсутствует"}
      - {value: 1, text: "Сообщает о своих переживаниях только при расспросе"}
      - {value: 2, text: "Сообщает свои переживания спонтанно вербальным образом"}
      - {value: 3, text: "Выражает свои переживания невербальным образом, т.е. мимикой, позой или жестами, голосом и готовностью к плачу"}
      - {value: 4, text: "Пациент как в спонтанных высказываниях, так и невербальным образом выражает только эти чувства"}
  - id: q2
    text: "Чувство вины"
    options:
      - {value: 0, text: "Отсутствует"}
      - {value: 1, text: "Высказывает самоупреки или идеи самоуничижения; считает, что подвел других"}
      - {value: 2, text: "Идеи собственной виновности или мучительные размышления о прошлых ошибках или грехах"}
      - {value: 3, text: "Настоящее заболевание расценивается как наказание; бредовые идеи виновности"}
      - {value: 4, text: "Вербальные галлюцинации обвиняющего и осуждающего содержания и/или угрожающие зрительные галлюцинации"}
  - id: q3
    text: "Суицидальные намерения"
    options:
      - {value: 0, text: "Отсутствует"}
      - {value: 1, text: "Ощущение малоценности жизни; говорит, что жить не стоит"}
      - {value: 2, text: "Желание смерти или какие-либо мысли о возможности собственной смерти"}
      - {value: 3, text: "Суицидальные высказывания или жесты"}
      - {value: 4, text: "Попытки самоубийства (любая серьезная попытка оценивается как «4»)"}
  - id: q4
    text: "Бессонница: ранняя (трудности при засыпании)"
    options:
      - {value: 0, text: "Отсутствие затруднений при засыпании"}
      - {value: 1, text: "Жалобы на эпизодические затруднения при засыпании (напр., дольше чем 1/2 часа)"}
      - {value: 2, text: "Жалобы на невозможность заснуть каждую ночь"}
  - id: q5
    text: "Бессонница: середина ночи"
    options:
      - {value: 0, text: "Отсутствует"}
      - {value: 1, text: "Жалобы на беспокойный сон в течение всей ночи"}
      - {value: 2, text: "Пробуждения в течение ночи — любой подъем с постели оценивается как «2» (исключая физиологические потребности)"}
  - id: q6
    text: "Бессонница поздняя: ранние утренние часы"
    options:
      - {value: 0, text: "Отсутствует"}
      - {value: 1, text: "Просыпается в ранние утренние часы, но снова засыпает"}
      - {value: 2, text: "При пробуждении заснуть повторно не удается"}
  - id: q7
    text: "Работоспособность и активность"
    options:
      - {value: 0, text: "Никаких затруднений не испытывает"}
      - {value: 1, text: "Мысли и ощущение несостоятельности, чувство усталости и слабости, связанное с деятельностью: работой или хобби"}
      - {value: 2, text: "Утрата интереса к деятельности: работе или хобби, выраженная непосредственно в жалобах или косвенно по степени проявляемого им безразличия к окружающему, нерешительности (чувство потребности в дополнительном усилии приступить к работе или проявить активность)"}
      - {value: 3, text: "Уменьшение реального времени проявления активности или снижение продуктивности. В условиях стационара оценка «3» выставляется, если активность пациента проявляется в течение не менее трех часов в день (работа в отделении или хобби), кроме обычных действий по обслуживанию самого себя"}
      - {value: 4, text: "Отказ от работы вследствие настоящего заболевания; в стационаре оценка «4» выставляется, если пациент вообще не проявляет активности или не справляется даже с рутинной бытовой деятельностью без посторонней помощи"}
  - id: q8
    text: "Заторможенность (замедленность мышления и речи, нарушение способности концентрировать внимание, снижение моторной активности)"
    options:
      - {value: 0, text: "Нормальная речь и мышление"}
      - {value: 1, text: "Легкая заторможенность в беседе"}
      - {value: 2, text: "Заметная заторможенность в беседе"}
      - {value: 3, text: "Беседа с больным затруднена"}
      - {value: 4, text: "Полный ступор"}
  - id: q9
    text: "Возбуждение (во время беседы)"
    options:
      - {value: 0, text: "Отсутствует"}
      - {value: 1, text: "Суетливость"}
      - {value: 2, text: "Беспокойные движения руками, теребление волос и т.д."}
      - {value: 3, text: "Подвижность, неусидчивость"}
      - {value: 4, text: "Заламывание рук, кусание ногтей, выдергивание волос, покусывание губ"}
  - id: q10
    text: "Психическая тревога"
    options:
      - {value: 0, text: "Отсутствует"}
      - {value: 1, text: "Субъективное напряжение и раздражительность"}
      - {value: 2, text: "Беспокойство по незначительным поводам"}
      - {value: 3, text: "Тревога, отражающаяся в выражении лица и речи"}
      - {value: 4, text: "Спонтанно излагает свои тревожные опасения"}
  - id: q11
    text: "Соматическая тревога (физиологические проявления тревоги: гастроинтестинальные — сухость во рту, метеоризм, диспепсия, диарея, спазмы, отрыжка; сердечно-сосудистые — сердцебиение, головные боли; дыхательные — гипервентиляция, одышка; учащенное мочеиспускание; повышенное потоотделение). Отмечайте согласно частоте и тяжести симптомов"
    options:
      - {value: 0, text: "Отсутствие"}
      - {value: 1, text: "Легкая"}
      - {value: 2, text: "Умеренная"}
      - {value: 3, text: "Тяжелая"}
      - {value: 4, text: "Крайне тяжелая (вплоть до функциональной недостаточности)"}
  - id: q12
    text: "Соматические симптомы, желудочно-кишечные"
    options:
      - {value: 0, text: "Нет"}
      - {value: 1, text: "Потеря аппетита, но ест без помощи персонала, ощущение тяжести в желудке"}
      - {value: 2, text: "Трудно есть без помощи персонала, просит слабительное или другое лекарство для ЖКТ"}
  - id: q13
    text: "Общие соматические симптомы"
    options:
      - {value: 0, text: "Нет"}
      - {value: 1, text: "Тяжесть в конечностях, спине или голове. Боли в пояснице, головные и мышечные боли. Утрата энергии и истощение"}
      - {value: 2, text: "Любые, ясно выраженные симптомы учитываются как 2"}
  - id: q14
    text: "Половые симптомы (такие, как например утрата либидо, менструальные проблемы)"
    options:
      - {value: 0, text: "Отсутствуют"}
      - {value: 1, text: "Средне"}
      - {value: 2, text: "Сильно"}
  - id: q15
    text: "Ипохондрия"
    options:
      - {value: 0, text: "Отсутствует"}
      - {value: 1, text: "Иногда появляются мысли о здоровье"}
      - {value: 2, text: "Поглощен мыслями о здоровье"}
      - {value: 3, text: "Частые жалобы, просьбы о помощи и т.п."}
      - {value: 4, text: "Ипохондрический бред"}
  - id: q16
    text: "Потеря веса"
    options:
      - {value: 0, text: "Не потерял в весе или вес потерян по другой причине, не связанной с настоящим заболеванием"}
      - {value: 1, text: "Подозревается потеря в весе по причине теперешнего заболевания"}
      - {value: 2, text: "Пациент уверенно подтверждает потерю веса из-за депрессии"}
  - id: q17
    text: "Критика"
    options:
      - {value: 0, text: "Подтверждает подавленность и заболевание или в данное время не в депрессии"}
      - {value: 1, text: "Подтверждает заболевание, но причиной тому ставит плохую пищу, переутомление, вирус, нужду в отдыхе и т.п."}
      - {value: 2, text: "Вообще отвергает, что болен"}
scores:
  - id: total
    items: [q1, q2, q3, q4, q5, q6, q7, q8, q9, q10, q11, q12, q13, q14, q15, q16, q17]
    bands:
      - {min: 0, max: 7, code: normal, label: "Норма", source: {source: kr-depression-2024, locator: "прил. Г1, ключ"}}
      - {min: 8, max: 13, code: mild, label: "Лёгкое депрессивное расстройство", source: {source: kr-depression-2024, locator: "прил. Г1, ключ"}}
      - {min: 14, max: 18, code: moderate, label: "Депрессивное расстройство средней степени тяжести", source: {source: kr-depression-2024, locator: "прил. Г1, ключ"}}
      - {min: 19, max: 22, code: severe, label: "Депрессивное расстройство тяжёлой степени", source: {source: kr-depression-2024, locator: "прил. Г1, ключ"}}
      # В КР — «более 23»; 23 отнесён сюда решением медика (см. шапку файла).
      - {min: 23, max: 52, code: extremely-severe, label: "Депрессивное расстройство крайне тяжёлой степени", source: {source: kr-depression-2024, locator: "прил. Г1, ключ («более 23»)"}}
