# HARS — шкала Гамильтона для оценки тревоги, заполняет врач (#6).
# Текст и ключ — по КР «Генерализованное тревожное расстройство» (kr-gad-2024, прил. Г1).
# Отдельного исследования валидации русской версии не найдено. Основной источник в
# validation — КР: русский текст и ключ. Оригинал Гамильтона (валидация самой шкалы) —
# международный источник, только дополнение. КР ссылаются только на оригинал
# (Hamilton 1959). Ограничение назвать в презентации.
# Подшкалы психической (пункты 1–6) и соматической (7–14) тревоги не заведены: порогов для
# них в КР нет. Пункты 7 и 8 в КР называются одинаково («Соматические симптомы»); уточнение
# «мышечные» и «сенсорные» взято из расшифровки ведущей симптоматики там же.
id: hars
version: 1
title: "Шкала Гамильтона для оценки тревоги (HARS)"
purpose: monitoring
respondent: clinician
status: reviewed
license:
  terms: "Общественное достояние по данным NINDS Common Data Elements (по вторичным источникам; первоисточник не открыт). Русский текст воспроизведён в КР Минздрава."
  allowed: true
  source: {source: kr-gad-2024, locator: "прил. Г1"}
validation:
  - {source: hamilton-hars-1959, locator: "оригинальная шкала и её валидация"}
  - {source: kr-gad-2024, locator: "прил. Г1: русский текст шкалы; исследования валидации русской версии не найдено"}
instruction: "Заполняет специалист по итогам полуструктурированного интервью (20–30 минут), учитывая анамнез и невербальное поведение. Шкалу не предъявляют пациенту и не задают ему прямых вопросов по пунктам."
items:
  - id: q1
    text: "Тревожное настроение (озабоченность, ожидание наихудшего, тревожные опасения, раздражительность)"
    options: &degree
      - {value: 0, text: "Отсутствует"}
      - {value: 1, text: "В слабой степени"}
      - {value: 2, text: "В умеренной степени"}
      - {value: 3, text: "В тяжелой степени"}
      - {value: 4, text: "В очень тяжелой степени"}
  - id: q2
    text: "Напряжение (ощущение напряжения, вздрагивание, легко возникающая плаксивость, дрожь, чувство беспокойства, неспособность расслабиться)"
    options: *degree
  - id: q3
    text: "Страхи (боязнь темноты, незнакомых людей, животных, транспорта, толпы, страх оставаться одному)"
    options: *degree
  - id: q4
    text: "Инсомния (затрудненное засыпание, прерывистый сон, не приносящий отдыха сон с чувством разбитости и слабости при пробуждении, кошмарные сновидения)"
    options: *degree
  - id: q5
    text: "Интеллектуальные нарушения (затрудненная концентрация внимания, ухудшение памяти)"
    options: *degree
  - id: q6
    text: "Депрессивное настроение (утрата привычных интересов, утрата чувства удовольствия от хобби, подавленность, ранние пробуждения, суточные колебания состояния)"
    options: *degree
  - id: q7
    text: "Соматические симптомы, мышечные (боли, мышечные подергивания, напряжение, миоклонические судороги, «скрипение» зубами, срывающийся голос, повышенный мышечный тонус)"
    options: *degree
  - id: q8
    text: "Соматические симптомы, сенсорные (звон в ушах, нечеткость зрения, приливы жара или холода, ощущение слабости, ощущение покалывания)"
    options: *degree
  - id: q9
    text: "Сердечно-сосудистые симптомы (тахикардия, сердцебиение, боль в груди, пульсация в сосудах, чувство слабости, частые вздохи, диспноэ)"
    options: *degree
  - id: q10
    text: "Респираторные симптомы (чувство давления или сжатия грудной клетки, ощущение удушья, частые вздохи, диспноэ)"
    options: *degree
  - id: q11
    text: "Гастроинтестинальные симптомы (затрудненное глотание, метеоризм, боль в животе, изжога, чувство переполнения желудка, тошнота, рвота, урчание в животе, диарея, снижение веса тела, запоры)"
    options: *degree
  - id: q12
    text: "Мочеполовые симптомы (учащенное мочеиспускание, сильные позывы на мочеиспускание, аменорея, меноррагия, фригидность, преждевременная эякуляция, утрата либидо, импотенция)"
    options: *degree
  - id: q13
    text: "Вегетативные симптомы (сухость во рту, покраснение кожных покровов, бледность кожных покровов, повышенное потоотделение, головные боли с чувством напряжения)"
    options: *degree
  - id: q14
    text: "Поведение при осмотре (ерзанье на месте, беспокойная жестикуляция или походка, тремор рук, нахмуривание бровей, напряженное выражение лица, вздохи или учащенное дыхание, бледность лица, частое сглатывание слюны и т.д.)"
    options: *degree
scores:
  - id: total
    items: [q1, q2, q3, q4, q5, q6, q7, q8, q9, q10, q11, q12, q13, q14]
    bands:
      - {min: 0, max: 7, code: absent, label: "Отсутствие тревоги", source: {source: kr-gad-2024, locator: "прил. Г1, ключ"}}
      - {min: 8, max: 17, code: mild, label: "Симптомы тревожного расстройства", source: {source: kr-gad-2024, locator: "прил. Г1, ключ"}}
      - {min: 18, max: 24, code: moderate, label: "Средняя выраженность тревожного расстройства", source: {source: kr-gad-2024, locator: "прил. Г1, ключ"}}
      - {min: 25, max: 56, code: severe, label: "Тяжёлая степень выраженности тревожного расстройства", source: {source: kr-gad-2024, locator: "прил. Г1, ключ"}}
