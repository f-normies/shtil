# PHQ-9 — опросник здоровья пациента, депрессия (#6).
# В КР «Депрессивный эпизод…» (kr-depression-2024) PHQ-9 нет; шкала нужна для самоотчёта
# пациента. Текст — валидированный перевод Золотаревой (прил., с. 121). Пороги тяжести —
# по Kroenke 2001 в изложении Золотаревой (zolotareva-gad7-2023, с. 35).
# Ограничение валидации (zolotareva-phq9-2023, с. 114): популяционная выборка, автор
# рекомендует опросник для исследований и ограничивает клиническое применение до
# валидизации в клинических условиях. Пункт q9 — мысли о смерти и самоповреждении.
id: phq-9
version: 1
title: "Опросник здоровья пациента (PHQ-9)"
purpose: screening
respondent: patient
status: reviewed
license:
  terms: "Pfizer: разрешение на перевод, воспроизведение и распространение не требуется. Русский перевод — Золотарева А.А., CC BY-NC 4.0."
  allowed: true
  source: {source: zolotareva-phq9-2023, locator: "с. 109"}
validation:
  - {source: zolotareva-phq9-2023, locator: "с. 107–121; ограничения — с. 114"}
instruction: "Оцените, пожалуйста, насколько часто следующие проблемы беспокоили вас в течение прошедших двух недель."
items:
  - id: q1
    text: "Снижение интереса и удовольствия от привычных дел"
    options: &freq
      - {value: 0, text: "Совсем нет"}
      - {value: 1, text: "В течение нескольких дней"}
      - {value: 2, text: "Более чем половину этого времени"}
      - {value: 3, text: "Почти каждый день"}
  - {id: q2, text: "Чувство подавленности или безнадежности", options: *freq}
  - {id: q3, text: "Проблемы со сном (неспособность заснуть, раннее пробуждение или слишком долгий сон)", options: *freq}
  - {id: q4, text: "Чувство усталости или недостатка энергии", options: *freq}
  - {id: q5, text: "Плохой аппетит или переедание", options: *freq}
  - {id: q6, text: "Плохое мнение о себе или чувство, что не смог оправдать ожиданий моей семьи", options: *freq}
  - {id: q7, text: "Проблемы с концентрацией внимания (например, при чтении газеты или просмотре телевизионной передачи)", options: *freq}
  - {id: q8, text: "Замедленность движений или речи, которая стала заметна другим людям, или, напротив, суетливость, когда движения и речь стали более быстрыми и беспокойными", options: *freq}
  - {id: q9, text: "Мысли о том, что мне бы хотелось умереть или причинить себе боль", options: *freq}
scores:
  - id: total
    items: [q1, q2, q3, q4, q5, q6, q7, q8, q9]
    bands:
      - {min: 0, max: 4, code: minimal, label: "Минимальная депрессия или её нет", source: {source: zolotareva-gad7-2023, locator: "с. 35, ниже порога лёгкой"}}
      - {min: 5, max: 9, code: mild, label: "Лёгкая депрессия", source: {source: zolotareva-gad7-2023, locator: "с. 35"}}
      # ≥ 10 — вероятное большое депрессивное расстройство (zolotareva-phq9-2023, с. 121).
      - {min: 10, max: 14, code: moderate, label: "Умеренная депрессия", source: {source: zolotareva-gad7-2023, locator: "с. 35"}}
      - {min: 15, max: 19, code: moderately-severe, label: "Умеренно тяжёлая депрессия", source: {source: zolotareva-gad7-2023, locator: "с. 35"}}
      - {min: 20, max: 27, code: severe, label: "Тяжёлая депрессия", source: {source: zolotareva-gad7-2023, locator: "с. 35"}}
