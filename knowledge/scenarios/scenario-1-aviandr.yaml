# Сценарий 1 с «Авиандром» (#7): ГТР у пациентки врача общей практики, назначение,
# мониторинг по шкалам, критический ответ, алерт и направление к психиатру.
# Источник по препарату — листок-вкладыш из ГРЛС (aviandr-leaflet-2026). В КР по ГТР
# маритупирдина нет, поэтому назначение опирается только на инструкцию.
# Все данные синтетические.
id: scenario-1-aviandr
status: draft
title: "ГТР у пациентки врача общей практики: назначение «Авиандра» и критический ответ на 3-й неделе"
patient:
  sex: female
  age: 34
  summary: "Около 7 месяцев постоянное беспокойство, напряжение, раздражительность и нарушения сна. Обратилась к врачу общей практики."
  history: "Тревога не связана с конкретной ситуацией, касается работы, здоровья близких, финансов; усилием воли не контролируется. Соматически здорова: функция печени и почек в норме (СКФ 95 мл/мин). Беременность исключена, грудью не кормит. Эпилепсии и органических поражений мозга нет. Других препаратов не принимает, в том числе ингибиторов МАО, антидепрессантов и других серотонинергических средств. Алкоголь — эпизодически, зависимости нет."
steps:
  - id: s1
    actor: doctor
    action: "Приглашает пациентку в систему; пациентка регистрируется по ссылке и даёт согласие"
    expected: "Пациентка привязана к лечащему врачу; её данные видит только этот врач"

  - id: s2
    actor: patient
    action: "Заполняет GAD-7 (сумма 14) и PHQ-9 (сумма 8, пункт 9 — 0)"
    expected: "Ответы сохранены в карточке пациентки у врача без участия третьих лиц"
    refs: {scales: [gad-7, phq-9]}
    sources:
      - {source: kr-gad-2024, locator: "раздел 2.5: скрининг GAD-7, УУР B (УДД 3)"}
      - {source: zolotareva-phq9-2023, locator: "прил., с. 121"}

  - id: s3
    actor: system
    action: "Считает баллы и показывает врачу тяжесть с источником порогов"
    expected: "GAD-7: 14 — умеренная тревога (≥ 10 — вероятное ГТР); PHQ-9: 8 — лёгкая депрессия. Правило алерта по пункту 9 не срабатывает. Срабатывает routing-anxiety-probable: консультация психиатра «желательна», сигнал отличим от «обязательно» иконкой и текстом; решение за врачом"
    refs: {scales: [gad-7, phq-9], rules: [phq9-suicidal-thoughts, routing-anxiety-probable]}
    sources:
      - {source: zolotareva-gad7-2023, locator: "с. 39, ключи"}
      - {source: zolotareva-gad7-2023, locator: "с. 35: пороги PHQ-9"}
      - {source: kr-gad-2024, locator: "прил. Г2, пояснение: скрининговый инструмент требует дальнейшей клинической диагностики"}

  - id: s4
    actor: doctor
    action: "Проводит осмотр и ставит предварительный диагноз F41.1 «Генерализованное тревожное расстройство»"
    expected: "Диагноз внесён врачом. Система диагноз не ставит"
    sources:
      - {source: kr-gad-2024, locator: "раздел 2: критерии диагноза, тревога не менее 6 месяцев"}

  - id: s5
    actor: system
    action: "Предлагает «Авиандр» 20 мг по показанию ГТР и проверяет противопоказания по профилю пациентки"
    expected: "Создано предложение (proposed) с источником. Сводка: «Противопоказаний по данным карты не найдено, уточните отмеченные пункты». По данным карты: возраст старше 18 лет, СКФ ≥ 60 мл/мин, печёночной недостаточности нет, беременности и лактации нет, эпилепсии нет, ингибиторы МАО не принимает. Гиперчувствительность и органическое заболевание головного мозга без кода в карте врач уточняет сам: эти пункты отмечены «уточните». Показаны предупреждения: принимать за 30 минут до еды, воздерживаться от алкоголя, в период лечения не управлять транспортными средствами и не работать с механизмами, возможны сонливость и головокружение"
    sources:
      - {source: aviandr-leaflet-2026, locator: "раздел 1: показания — ГТР у взрослых старше 18 лет"}
      - {source: aviandr-leaflet-2026, locator: "раздел 2: противопоказания и меры предосторожности"}
      - {source: aviandr-leaflet-2026, locator: "раздел 2: управление транспортными средствами и работа с механизмами"}

  - id: s6
    actor: doctor
    action: "Подтверждает назначение: «Авиандр» по 1 таблетке (20 мг) 2 раза в сутки, утром и вечером; длительность определяет врач, контроль через 2 недели"
    expected: "Предложение подтверждено (confirmed); назначение действует только после подтверждения врача"
    sources:
      - {source: aviandr-leaflet-2026, locator: "раздел 3: рекомендуемая доза при ГТР"}

  - id: s7
    actor: patient
    action: "Через 2 недели повторно заполняет GAD-7 (сумма 9) и PHQ-9 (сумма 6, пункт 9 — 0)"
    expected: "Врач видит снижение тревоги с умеренной до лёгкой; сигналов нет"
    refs: {scales: [gad-7, phq-9]}
    sources:
      - {source: zolotareva-gad7-2023, locator: "с. 39, ключи"}
      - {source: zolotareva-gad7-2023, locator: "с. 35: пороги PHQ-9"}

  - id: s8
    actor: patient
    action: "На 3-й неделе заполняет PHQ-9 и на пункт 9 отвечает «В течение нескольких дней» (1)"
    expected: "Ответ сохранён и сразу проверяется правилами"
    refs: {scales: [phq-9]}
    sources:
      - {source: zolotareva-phq9-2023, locator: "прил., с. 121, пункт 9"}

  - id: s9
    actor: system
    action: "Срабатывает правило phq9-suicidal-thoughts и экстренно оповещает врача"
    expected: "Сигнал уровня «обязательно» выделен в кабинете врача цветом, иконкой и текстом; доставлен по WebSocket; в сигнале — ответ на пункт 9, действия врача и источники"
    refs: {scales: [phq-9], rules: [phq9-suicidal-thoughts]}
    sources:
      - {source: kr-depression-2024, locator: "раздел 2.5: выявление факторов риска суицида у всех пациентов, УУР B (УДД 2)"}

  - id: s10
    actor: doctor
    action: "Подтверждает получение сигнала, в тот же день связывается с пациенткой, оценивает суицидальный риск и решает направить её к психиатру"
    expected: "Время доставки и подтверждения сигнала записаны. Направление создаётся как предложение и требует подтверждения врача"
    refs: {rules: [phq9-suicidal-thoughts]}
    sources:
      - {source: kr-depression-2024, locator: "раздел 2.5: факторы суицидального риска"}
      - {source: kr-depression-2024, locator: "раздел 6: высокий суицидальный риск — показание к стационарному лечению"}

  - id: s11
    actor: system
    action: "Фиксирует направление к психиатру после подтверждения врачом"
    expected: "Направление в карточке со статусом confirmed, автором и временем подтверждения. Система не направляет пациентку сама"
    sources:
      - {source: kr-depression-2024, locator: "раздел 2.1: приём врача-психиатра с оценкой риска суицидального поведения, УУР C (УДД 5)"}
