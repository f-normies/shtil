# Сценарий 2 с «Авиандром» (#37): тревожное состояние после COVID-19, предупреждение
# о взаимодействии при назначении, нежелательная реакция из дневника и отмена препарата.
# Источники по препарату — листок-вкладыш из ГРЛС (aviandr-leaflet-2026) и ОХЛП
# версии 0010 (aviandr-ohlp). Правила как данные (#29) — в knowledge/drugs/aviandr.yaml:
# шаг s5 — противопоказания (contraindications) и предупреждение о триптанах
# (cautions.serotonergic, группа knowledge/drug-groups/serotonergic.yaml); шаг s8 —
# уровни нежелательных реакций (adverse_reactions) и действия врача (reaction_actions).
# Пациент для записи роликов — patient8@example.com в сиде (apps/api/src/clin_compass/seed/data.py).
# Все данные синтетические.
id: scenario-2-aviandr-post-covid
status: draft
title: "Тревога после COVID-19: курс «Авиандра» и нежелательная реакция на 10-й день"
patient:
  sex: male
  age: 46
  summary: "Через 2 месяца после COVID-19 тревога, вспыльчивость, раздражительность и плохой сон. Обратился к врачу общей практики."
  history: "COVID-19 средней тяжести 2 месяца назад, лечился амбулаторно. После болезни тревожится о здоровье и работе, срывается на близких, засыпает с трудом; с прежней нагрузкой не справляется. До болезни тревожных и депрессивных эпизодов не было. Мигрень без ауры много лет, принимает суматриптан 50 мг по требованию 2–3 раза в месяц. Органических поражений головного мозга и эпилепсии нет. Функция печени и почек в норме (СКФ 88 мл/мин). Сердечно-сосудистых и эндокринных заболеваний нет. Ингибиторы МАО и антидепрессанты не принимает. Алкоголь — эпизодически, зависимости нет."
steps:
  - id: s1
    actor: doctor
    action: "Приглашает пациента в систему; пациент регистрируется по ссылке и даёт согласие"
    expected: "Пациент привязан к лечащему врачу; его данные видит только этот врач"

  - id: s2
    actor: patient
    action: "Заполняет GAD-7 (сумма 9) и PHQ-9 (сумма 6, пункт 9 — 0)"
    expected: "Ответы сохранены в карточке пациента у врача без участия третьих лиц"
    refs: {scales: [gad-7, phq-9]}
    sources:
      - {source: kr-gad-2024, locator: "раздел 2.5: скрининг GAD-7, УУР B (УДД 3)"}
      - {source: zolotareva-phq9-2023, locator: "прил., с. 121"}

  - id: s3
    actor: system
    action: "Считает баллы и показывает врачу тяжесть с источником порогов"
    expected: "GAD-7: 9 — лёгкая тревога; PHQ-9: 6 — лёгкая депрессия. Правила алерта и маршрутизации не срабатывают"
    refs: {scales: [gad-7, phq-9]}
    sources:
      - {source: zolotareva-gad7-2023, locator: "с. 39, ключи"}
      - {source: zolotareva-gad7-2023, locator: "с. 35: пороги PHQ-9"}

  - id: s4
    actor: doctor
    action: "Проводит осмотр и фиксирует тревожное состояние после COVID-19 со стрессовой реакцией и нарушением адаптации лёгкой степени"
    expected: "Диагноз внесён врачом. Система диагноз не ставит"
    sources:
      - {source: aviandr-leaflet-2026, locator: "раздел 1: показания — тревожные состояния после COVID-19 при стрессовой реакции и нарушении адаптации лёгкой и средней степени"}

  - id: s5
    actor: system
    action: "Предлагает «Авиандр» 20 мг по показанию «тревожное состояние после COVID-19» и проверяет противопоказания и сопутствующие препараты"
    expected: "Создано предложение (proposed) с источником: по 1 таблетке 2 раза в сутки, курс 4 недели, при необходимости до 6 недель по решению врача. Сводка: «Противопоказаний по данным карты не найдено, уточните отмеченные пункты». По данным карты: возраст старше 18 лет, СКФ ≥ 60 мл/мин, печёночной недостаточности нет, эпилепсии и органических поражений мозга нет, ингибиторы МАО не принимает. Гиперчувствительность и органическое заболевание головного мозга без кода в карте врач уточняет сам: эти пункты отмечены «уточните». Предупреждение уровня «желательно»: суматриптан относится к триптанам, вместе с «Авиандром» — с осторожностью из-за риска серотонинового синдрома; противопоказанием это не является. Показаны указания: за 30 минут до еды, без алкоголя, возможны сонливость и головокружение"
    sources:
      - {source: aviandr-leaflet-2026, locator: "раздел 3: доза и длительность курса при тревожных состояниях после COVID-19"}
      - {source: aviandr-leaflet-2026, locator: "раздел 2: противопоказания"}
      - {source: aviandr-ohlp, locator: "4.5, «Лекарственные препараты с серотонинергическим действием»: триптаны — с осторожностью, риск серотонинового синдрома"}

  - id: s6
    actor: doctor
    action: "Подтверждает назначение: «Авиандр» 20 мг 2 раза в сутки, курс 4 недели, контроль через 2 недели. Суматриптан оставляет по требованию и просит отмечать в дневнике новые симптомы"
    expected: "Предложение подтверждено (confirmed); назначение действует только после подтверждения врача. У пациента в кабинете появилась схема приёма"
    sources:
      - {source: aviandr-leaflet-2026, locator: "раздел 3: путь и способ введения"}

  - id: s7
    actor: patient
    action: "На 10-й день отмечает в дневнике «скованность мышц» и «потливость» и пишет: «вчера вечером пил суматриптан от мигрени, с утра сводит челюсть, весь день мокрый»"
    expected: "Запись сохранена в карточке пациента и сразу проверяется"
    sources:
      - {source: aviandr-ohlp, locator: "4.8, таблица 1: нечасто — гипергидроз; скованность мышц, тризм"}

  # Уровень «обязательно» для скованности мышц, тризма и гипергидроза — решение медика:
  # в ОХЛП уровня нет, в 4.8 эти реакции отмечены как «нечасто» без указаний о срочности.
  # Причина: пациент принимает суматриптан, и эти симптомы могут быть проявлением
  # серотонинового синдрома (4.5).
  - id: s8
    actor: system
    action: "Сопоставляет отмеченные симптомы с перечнем нежелательных реакций из инструкции и оповещает врача"
    expected: "Предупреждение о безопасности терапии уровня «обязательно»: скованность мышц и повышенная потливость на фоне приёма суматриптана, исключить серотониновый синдром. Предупреждение выделено цветом, иконкой и текстом; в нём симптомы, дата начала приёма «Авиандра», дата последнего приёма суматриптана по записи пациента и источники. Разбор текста записи может только добавить симптом (тризм) и не снимает сигнал"
    sources:
      - {source: aviandr-ohlp, locator: "4.8, таблица 1: нечасто — гипергидроз; скованность мышц, тризм"}
      - {source: aviandr-ohlp, locator: "4.5, «Лекарственные препараты с серотонинергическим действием»: триптаны — с осторожностью, риск серотонинового синдрома"}

  # Признаков серотонинового синдрома в ОХЛП 0010 нет: что осматривать, решает врач.
  - id: s9
    actor: doctor
    action: "В тот же день связывается с пациентом, уточняет время последнего приёма суматриптана, оценивает температуру тела, клонус, тахикардию и возбуждение. При тяжёлом состоянии организует экстренную медицинскую помощь. Решает отменить «Авиандр»"
    expected: "Отмена создаётся как предложение и действует после подтверждения врача. Система препарат сама не отменяет"
    sources:
      - {source: aviandr-ohlp, locator: "4.5, «Лекарственные препараты с серотонинергическим действием»: риск серотонинового синдрома"}
      - {source: aviandr-leaflet-2026, locator: "раздел 4: врач может изменить схему лечения, прекратить лечение или снизить дозу"}

  - id: s10
    actor: system
    action: "Фиксирует отмену и готовит черновик извещения о нежелательной реакции"
    expected: "Отмена в карточке со статусом confirmed, автором и временем; схема приёма у пациента обновлена. Черновик извещения содержит препарат, дозу, даты и симптомы; отправляет его врач. Препарат подлежит дополнительному мониторингу"
    sources:
      - {source: aviandr-leaflet-2026, locator: "▼ дополнительный мониторинг; раздел 4: сообщение о нежелательных реакциях в Росздравнадзор"}

  - id: s11
    actor: patient
    action: "Через 3 дня отмечает в дневнике, что скованность и потливость прошли"
    expected: "Врач видит в карточке разрешение нежелательной реакции после отмены и сам определяет дальнейшую тактику"
