# Сценарий 3 с «Авиандром» (#37): ГТР с депрессивной симптоматикой, временное
# противопоказание после отмены ингибитора МАО, сигналы «желательно» по двум шкалам
# и назначение после окончания противопоказания.
# Источник по препарату — листок-вкладыш из ГРЛС (aviandr-leaflet-2026). Правило
# противопоказания после ингибитора МАО как данные (#29) — contraindications.maoi в
# knowledge/drugs/aviandr.yaml; оно работает на шагах s5 и s9. Пациентки для записи
# роликов — patient6 (10 дней после отмены) и patient7 (16 дней) в сиде.
# Сахарный диабет предупреждения не даёт: по ОХЛП версии 0010 (aviandr-ohlp, 4.4,
# «Эндокринные заболевания») влияния на уровень глюкозы крови не выявлено.
# Все данные синтетические.
id: scenario-3-aviandr-contraindication
status: draft
title: "ГТР и депрессивная симптоматика после отмены моклобемида: противопоказание по сроку и направление к психиатру"
patient:
  sex: female
  age: 52
  summary: "Около года постоянная тревога, последние 2 месяца — сниженное настроение и утомляемость. Обратилась к врачу общей практики."
  history: "Беспокоится о здоровье, детях и работе, расслабиться не может, плохо спит. Последние 2 месяца настроение снижено, интерес к делам меньше, быстро устаёт. Полгода назад в частной клинике назначен моклобемид 300 мг/сут; эффекта не было, 10 дней назад отменён тем же врачом. Сахарный диабет 2 типа, принимает метформин, компенсирован. Функция печени и почек в норме (СКФ 78 мл/мин). Постменопауза. Эпилепсии и органических поражений мозга нет. Алкоголь не употребляет."
steps:
  - id: s1
    actor: doctor
    action: "Приглашает пациентку в систему; пациентка регистрируется по ссылке и даёт согласие"
    expected: "Пациентка привязана к лечащему врачу; её данные видит только этот врач"

  - id: s2
    actor: patient
    action: "Заполняет GAD-7 (сумма 13) и PHQ-9 (сумма 16, пункт 9 — 0)"
    expected: "Ответы сохранены в карточке пациентки у врача без участия третьих лиц"
    refs: {scales: [gad-7, phq-9]}
    sources:
      - {source: kr-gad-2024, locator: "раздел 2.5: скрининг GAD-7, УУР B (УДД 3)"}
      - {source: zolotareva-phq9-2023, locator: "прил., с. 121"}

  - id: s3
    actor: system
    action: "Считает баллы и показывает врачу тяжесть и сигналы маршрутизации"
    expected: "GAD-7: 13 — умеренная тревога; PHQ-9: 16 — умеренно тяжёлая депрессия. Правило по пункту 9 не срабатывает. Срабатывают routing-anxiety-probable и routing-depression-probable: консультация психиатра «желательна», в каждом сигнале — действия врача и источники"
    refs: {scales: [gad-7, phq-9], rules: [phq9-suicidal-thoughts, routing-anxiety-probable, routing-depression-probable]}
    sources:
      - {source: zolotareva-gad7-2023, locator: "с. 39, ключи"}
      - {source: zolotareva-gad7-2023, locator: "с. 35: пороги PHQ-9"}
      - {source: zolotareva-phq9-2023, locator: "с. 121: PHQ-9 ≥ 10 — вероятное большое депрессивное расстройство"}

  - id: s4
    actor: doctor
    action: "Проводит осмотр, ставит предварительный диагноз F41.1 «Генерализованное тревожное расстройство», отмечает депрессивную симптоматику и запрашивает варианты терапии"
    expected: "Диагноз внесён врачом. Система диагноз не ставит"
    sources:
      - {source: kr-gad-2024, locator: "раздел 2: критерии диагноза, тревога не менее 6 месяцев"}

  - id: s5
    actor: system
    action: "Проверяет «Авиандр» по профилю пациентки"
    expected: "«Авиандр» не предложен. Предупреждение о безопасности уровня «обязательно»: моклобемид — ингибитор МАО, отменён 10 дней назад; противопоказание действует 2 недели после отмены, 14-й день включительно; показана дата, с которой можно назначать (через 5 дней). На том же экране сигналы «желательно» из шага s3 отличимы от «обязательно» иконкой и текстом"
    sources:
      - {source: aviandr-leaflet-2026, locator: "раздел 2: противопоказания — ингибиторы МАО и 2 недели после их отмены"}
      - {source: aviandr-leaflet-2026, locator: "раздел 2, «Другие препараты»: моклобемид в списке ингибиторов МАО"}

  - id: s6
    actor: doctor
    action: "Решает направить пациентку к психиатру для уточнения диагноза и выбора терапии; решение о «Авиандре» откладывает"
    expected: "Направление создаётся как предложение и требует подтверждения врача"
    refs: {rules: [routing-anxiety-probable, routing-depression-probable]}
    sources:
      - {source: kr-depression-2024, locator: "раздел 2.1: первичный приём врача-психиатра всем пациентам, УУР C (УДД 5)"}
      - {source: kr-gad-2024, locator: "прил. Г2, пояснение: скрининговый инструмент требует дальнейшей клинической диагностики"}

  - id: s7
    actor: system
    action: "Фиксирует направление к психиатру после подтверждения врачом"
    expected: "Направление в карточке со статусом confirmed, категорией «желательно», автором и временем подтверждения. Система не направляет пациентку сама"
    sources:
      - {source: kr-depression-2024, locator: "раздел 2.1: приём врача-психиатра первичный с психопатологическим обследованием, УУР C (УДД 5)"}

  - id: s8
    actor: doctor
    action: "На 16-й день после отмены моклобемида вносит заключение психиатра (ГТР с депрессивной симптоматикой, суицидального риска нет, рекомендована противотревожная терапия) и снова запрашивает варианты терапии"
    expected: "Заключение сохранено в карточке; варианты терапии пересчитываются по актуальному профилю"
    sources:
      - {source: kr-depression-2024, locator: "раздел 6: ДЭ лёгкой и средней степени без суицидального риска — амбулаторно"}

  - id: s9
    actor: system
    action: "Предлагает «Авиандр» 20 мг по показанию ГТР"
    expected: "Создано предложение (proposed): по 1 таблетке 2 раза в сутки, длительность определяет врач. Противопоказание по ингибитору МАО больше не действует: прошло больше 2 недель. Показаны указания: за 30 минут до еды, без алкоголя"
    sources:
      - {source: aviandr-leaflet-2026, locator: "раздел 1: показания — ГТР у взрослых старше 18 лет"}
      - {source: aviandr-leaflet-2026, locator: "раздел 3: рекомендуемая доза при ГТР"}
      - {source: aviandr-leaflet-2026, locator: "раздел 2: противопоказания — ингибиторы МАО и 2 недели после их отмены"}

  - id: s10
    actor: doctor
    action: "Подтверждает назначение и планирует повторные GAD-7 и PHQ-9 через 2 недели"
    expected: "Предложение подтверждено (confirmed); назначение действует только после подтверждения врача"
