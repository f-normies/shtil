# Решения врача по сигналам (спека #93). Значения — ответ медика в #93:
# Читают #95 (решение по сигналу, отсрочка) и #35 (отказ от направления).
# Комментарий врача к любой причине отказа обязателен: решение должно быть объяснено в истории.
version: 1
status: reviewed

# Сигналы о суицидальном риске: правила kind: alert и виды признаков signs/.
# Варианта «отклонить» нет: сигнал закрывается только после контакта и оценки риска.
safety:
  decisions:
    - id: high-risk-referred
      text: "Риск высокий: оформлено направление к психиатру или на госпитализацию"
      reason_hint: "что сделано"
      sources:
        - {source: kr-depression-2024, locator: "раздел 2.5: обследование для выявления факторов риска суицида — всем пациентам, УУР B (УДД 2)"}
        - {source: kr-depression-2024, locator: "раздел 3.1.3: ДЭ с высоким суицидальным риском — лечение в стационаре, УУР B (УДД 1)"}
        - {source: kr-depression-2024, locator: "раздел 6: высокий суицидальный риск — показание к стационарному лечению независимо от степени тяжести депрессии"}
    - id: risk-not-high
      text: "Риск не высокий: наблюдение продолжается"
      reason_hint: "план наблюдения и дата следующего контакта"
      sources:
        - {source: kr-depression-2024, locator: "раздел 2.5: обследование для выявления факторов риска суицида — всем пациентам, УУР B (УДД 2)"}
        - {source: kr-depression-2024, locator: "раздел 6: ДЭ лёгкой и средней степени без суицидального риска — амбулаторно в ПНД"}
    - id: risk-not-confirmed
      text: "Риск не подтверждён: ответ дан по ошибке"
      reason_hint: "что сказал пациент"
      sources:
        - {source: kr-depression-2024, locator: "раздел 2.5: обследование для выявления факторов риска суицида — всем пациентам, УУР B (УДД 2)"}
  # Запись в истории: сигнал остаётся «в работе».
  no_contact:
    text: "Не удалось связаться"
    sources:
      - {source: kr-depression-2024, locator: "раздел 2.5: обследование для выявления факторов риска суицида — всем пациентам, УУР B (УДД 2)"}

# Сигналы безопасности терапии (#29, спека #95): противопоказание, мера предосторожности
# или препарат без МНН, отметка нежелательной реакции. Варианты — поле «Предпринятые меры»
# извещения о нежелательной реакции (приказ № 3518, прил. 1) и листок-вкладыш «Авиандра».
# Система препарат не отменяет и дозу не меняет: вариант фиксирует, что сделал врач.
# Продолжения лечения при противопоказании нет: источника для него нет.
therapy:
  decisions:
    - id: drug-stopped
      text: "Препарат отменён"
      reason_hint: "что сделано и когда"
      applies_to: [contraindication, caution, reaction]
      sources:
        - {source: rzn-pharmacovigilance-2024, locator: "прил. 1, «Предпринятые меры»: «Отмена подозреваемого лекарственного препарата»"}
        - {source: aviandr-leaflet-2026, locator: "раздел 4: врач может решить прекратить лечение"}
    - id: dose-reduced
      text: "Доза снижена"
      reason_hint: "новая доза и план наблюдения"
      applies_to: [caution, reaction]
      sources:
        - {source: rzn-pharmacovigilance-2024, locator: "прил. 1, «Предпринятые меры»: «Снижение дозы лекарственного препарата»"}
        - {source: aviandr-leaflet-2026, locator: "раздел 4: врач может снизить дозу"}
    - id: reaction-treated
      text: "Препарат продолжен, назначено лечение реакции"
      reason_hint: "какое лечение назначено"
      applies_to: [reaction]
      sources:
        - {source: rzn-pharmacovigilance-2024, locator: "прил. 1, «Предпринятые меры»: «Лекарственная терапия», «Немедикаментозная терапия»"}
    - id: continued-monitoring
      text: "Препарат продолжен без изменений, наблюдение"
      reason_hint: "почему польза выше риска и план наблюдения"
      applies_to: [caution, reaction]
      sources:
        - {source: rzn-pharmacovigilance-2024, locator: "прил. 1, «Предпринятые меры»: «Без лечения»"}
        - {source: aviandr-ohlp, locator: "4.4, 4.5: применять с осторожностью"}
    # Организационный вариант: данные карты были ошибочны. Источника нет, как у причин отказа.
    - id: data-corrected
      text: "Противопоказание не подтвердилось: данные карты исправлены"
      reason_hint: "что исправлено"
      applies_to: [contraindication]

# Отказ от направления к психиатру. У организационных причин документа-источника нет.
referral_decline:
  reasons:
    - id: already-under-psychiatrist
      text: "Пациент уже наблюдается у психиатра"
    - id: patient-declined
      text: "Пациент отказался от консультации"
      sources:
        - {source: law-psychiatric-care, locator: "ст. 4, ч. 1 и 3: помощь оказывается при добровольном обращении или с согласия лица; право отказаться от медицинского вмешательства, кроме случаев, предусмотренных Законом"}
    - id: assessment-not-confirmed
      text: "Клиническая оценка не подтверждает баллы самоотчёта"
      sources:
        - {source: kr-gad-2024, locator: "прил. Г2, пояснение: скрининговый инструмент требует дальнейшей клинической диагностики"}
    - id: somatic-cause
      text: "Симптомы объясняются соматической причиной, назначено обследование"
      sources:
        - {source: kr-gad-2024, locator: "раздел 2: исключение соматических причин тревоги при диагностике"}
    - id: consultation-planned
      text: "Консультация психиатра уже запланирована"
    - id: other
      text: "Другое"

# Отсрочка сигнала «Желательно». «Другая дата» — тоже не позже max_days.
snooze:
  max_days: 14
  presets_days: [3, 7, 14]
  basis: "Норматива срока в КР нет, решение медика (#93): 14 дней — период планового опроса PHQ-9 и GAD-7, к концу отсрочки у врача новые баллы"
