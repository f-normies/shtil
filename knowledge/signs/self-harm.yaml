title: "Самоповреждение в тексте пациента"
definition: |
  Пациент пишет, что причиняет или причинил себе вред без цели умереть: порезы, ожоги, удары.
  Примеры: «опять порезала руку», «прижигаю себя сигаретой, так становится легче».
