id: suicidal-intent
version: 1
status: reviewed
rank: 1
title: "Признаки суицидального намерения или плана в тексте пациента"
definition: |
  Пациент пишет о намерении покончить с собой, о плане (способ, время, место),
  о приготовлениях или о попытке, в том числе прошлой. Приготовления — копит таблетки,
  раздаёт вещи, пишет прощальные письма, прощается.
  Примеры: «решила, как это сделаю», «коплю таблетки», «написал прощальное письмо»,
  «вчера пыталась отравиться».
doctor_actions:
  - "Связаться с пациентом и оценить суицидальный риск: мысли, намерения, планы, попытки в прошлом, доступ к средствам"
  - "При высоком суицидальном риске рассмотреть стационарное лечение"
sources:
