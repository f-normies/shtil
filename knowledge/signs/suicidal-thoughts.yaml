# Вид признака риска для разбора дневника и чата (спека #32, раздел 6.1).
id: suicidal-thoughts
version: 1
status: reviewed
rank: 4
title: "Мысли о смерти или самоубийстве в тексте пациента"
definition: |
  Пациент пишет о мыслях о смерти, нежелании жить или мыслях о самоубийстве без плана
  и намерения. Сюда относятся и косвенные формулировки.
  Примеры: «не хочу жить», «лучше бы не просыпаться», «всем было бы лучше без меня»,
  «думаю, как бы всё это закончить».
  Не относятся: устойчивые выражения («умираю от скуки», «убить время»), рассказ о смерти
  другого человека.
doctor_actions:
  - "Связаться с пациентом и оценить суицидальный риск: мысли, намерения, планы, попытки в прошлом, доступ к средствам"
